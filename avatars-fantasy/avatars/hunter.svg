<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Hunter</title>
    <style>
      .hu-body{transform-box:fill-box;transform-origin:50% 100%;animation:hu-bob 2.9s ease-in-out infinite}
      .hu-mood{display:none}
      svg[data-mood="neutral"] .hu-mood-n,svg[data-mood="happy"] .hu-mood-h,svg[data-mood="sad"] .hu-mood-s,svg[data-mood="angry"] .hu-mood-a,svg[data-mood="surprised"] .hu-mood-u,svg[data-mood="sleeping"] .hu-mood-z{display:inline}
      .hu-eye{transform-box:fill-box;transform-origin:50% 50%;animation:hu-blink 4.5s infinite}
      @keyframes hu-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
      @keyframes hu-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
      @media(prefers-reduced-motion:reduce){.hu-body,.hu-eye{animation:none}}
    </style>
    <g class="hu-body">
      <path d="M48 58 C36 58 26 66 24 94 h48 C70 66 60 58 48 58Z" fill="#3f6212"/>
      <path d="M34 60 L62 60 L60 72 L36 72 Z" fill="#65a30d" opacity=".7"/>
      <ellipse cx="48" cy="44" rx="12" ry="13" fill="#f2ddc4"/>
      <!-- cap -->
      <path d="M30 38 C30 26 40 20 48 20 C56 20 66 26 66 38 L70 40 L30 40 Z" fill="#4d7c0f"/>
      <rect x="28" y="38" width="44" height="4" rx="2" fill="#365314"/>
      <g class="hu-mood hu-mood-n">
        <ellipse class="hu-eye" cx="43" cy="44" rx="1.7" ry="2.2" fill="#1c1917"/>
        <ellipse class="hu-eye" cx="53" cy="44" rx="1.7" ry="2.2" fill="#1c1917"/>
        <path d="M44 50 L52 50" stroke="#7a4a3a" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="hu-mood hu-mood-h" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 45 q2-2.4 4 0"/><path d="M51 45 q2-2.4 4 0"/>
        <path d="M44 50 Q48 53 52 50" stroke="#7a4a3a"/>
      </g>
      <g class="hu-mood hu-mood-s">
        <ellipse class="hu-eye" cx="43" cy="45" rx="1.6" ry="2" fill="#1c1917"/>
        <ellipse class="hu-eye" cx="53" cy="45" rx="1.6" ry="2" fill="#1c1917"/>
        <path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="hu-mood hu-mood-a">
        <path d="M40 42 L46 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 42 L50 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="hu-eye" cx="43" cy="45" rx="1.6" ry="2" fill="#1c1917"/>
        <ellipse class="hu-eye" cx="53" cy="45" rx="1.6" ry="2" fill="#1c1917"/>
        <path d="M44 51 Q48 49 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="hu-mood hu-mood-u">
        <ellipse class="hu-eye" cx="43" cy="44" rx="2.2" ry="2.8" fill="#1c1917"/>
        <ellipse class="hu-eye" cx="53" cy="44" rx="2.2" ry="2.8" fill="#1c1917"/>
        <ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#7a4a3a"/>
      </g>
      <g class="hu-mood hu-mood-z">
        <path d="M40 44 Q43 46 46 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 44 Q53 46 56 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="51" rx="2" ry="1.2" fill="#7a4a3a"/>
      </g>
      <!-- bow -->
      <g transform="translate(20,60)">
        <path d="M0 0 L-14 -10 M0 0 L-14 10" stroke="#8b5a2b" stroke-width="2" fill="none"/>
        <path d="M-14 -10 Q-20 0 -14 10" stroke="#8b5a2b" stroke-width="1.5" fill="none"/>
        <line x1="0" y1="0" x2="-14" y2="0" stroke="#d4a056" stroke-width="1"/>
      </g>
      <!-- binoculars -->
      <g transform="translate(72,52)">
        <circle cx="-4" cy="0" r="5" fill="#365314" stroke="#1a2e05" stroke-width="1"/>
        <circle cx="4" cy="0" r="5" fill="#365314" stroke="#1a2e05" stroke-width="1"/>
        <rect x="-2" y="-2" width="4" height="4" fill="#1a2e05"/>
      </g>
    </g>
  </svg>