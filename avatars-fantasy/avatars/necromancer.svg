<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .nc-b{transform-box:fill-box;transform-origin:50% 100%;animation:nc-bob 3.4s ease-in-out infinite}
      .nc-m{display:none}
      svg[data-mood="neutral"] .nc-n,svg[data-mood="happy"] .nc-h,svg[data-mood="sad"] .nc-s,svg[data-mood="angry"] .nc-a,svg[data-mood="surprised"] .nc-u,svg[data-mood="sleeping"] .nc-z{display:inline}
      .nc-eye{animation:nc-blink 4.6s infinite}
      .nc-orb{animation:nc-pulse 2s ease-in-out infinite}
      @keyframes nc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes nc-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
      @keyframes nc-pulse{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
    <g class="nc-b">
