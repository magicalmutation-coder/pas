      <g class="nc-m nc-h" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"><path d="M42 47 q2-2.2 4 0"/><path d="M50 47 q2-2.2 4 0"/><path d="M45 51 Q48 53 51 51" stroke="#6b21a8"/></g>
      <g class="nc-m nc-s"><circle cx="44" cy="47" r="1.5" fill="#7c3aed"/><circle cx="52" cy="47" r="1.5" fill="#7c3aed"/><path d="M45 52 Q48 49 51 52" fill="none" stroke="#6b21a8" stroke-width="1.1" stroke-linecap="round"/></g>
      <g class="nc-m nc-a"><path d="M41 44 L46 46" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M55 44 L50 46" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="44" cy="47" r="1.5" fill="#ef4444"/><circle cx="52" cy="47" r="1.5" fill="#ef4444"/><path d="M45 52 Q48 50 51 52" fill="none" stroke="#6b21a8" stroke-width="1.1" stroke-linecap="round"/></g>
      <g class="nc-m nc-u"><circle cx="44" cy="46" r="2" fill="#fbbf24"/><circle cx="52" cy="46" r="2" fill="#fbbf24"/><ellipse cx="48" cy="52" rx="1.8" ry="2" fill="#6b21a8"/></g>
      <g class="nc-m nc-z"><path d="M41 46 h6" stroke="#a855f7" stroke-width="1.6" stroke-linecap="round"/><path d="M51 46 h6" stroke="#a855f7" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="48" cy="52" rx="1.8" ry="1.1" fill="#6b21a8"/></g>
