      <g class="yt-m yt-s"><ellipse cx="42" cy="45" rx="2" ry="2.4" fill="#1c1917"/><ellipse cx="54" cy="45" rx="2" ry="2.4" fill="#1c1917"/><path d="M44 53 q4-2 8 0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="yt-m yt-a"><path d="M39 41 L45 44" stroke="#1c1917" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M57 41 L51 44" stroke="#1c1917" stroke-width="1.7" stroke-linecap="round" fill="none"/><ellipse cx="42" cy="45" rx="2" ry="2.4" fill="#1c1917"/><ellipse cx="54" cy="45" rx="2" ry="2.4" fill="#1c1917"/></g>
