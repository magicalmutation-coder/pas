<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .yt-b{transform-box:fill-box;transform-origin:50% 100%;animation:yt-bob 3.6s ease-in-out infinite}
      .yt-m{display:none}
      svg[data-mood="neutral"] .yt-n,svg[data-mood="happy"] .yt-h,svg[data-mood="sad"] .yt-s,svg[data-mood="angry"] .yt-a,svg[data-mood="surprised"] .yt-u,svg[data-mood="sleeping"] .yt-z{display:inline}
      .yt-eye{animation:yt-blink 5s infinite}
      @keyframes yt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes yt-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
    </style>
