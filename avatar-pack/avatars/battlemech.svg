<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .bm-b{transform-box:fill-box;transform-origin:50% 100%;animation:bm-bob 3.6s ease-in-out infinite}
      .bm-m{display:none}
      svg[data-mood="neutral"] .bm-n,svg[data-mood="happy"] .bm-h,svg[data-mood="sad"] .bm-s,svg[data-mood="angry"] .bm-a,svg[data-mood="surprised"] .bm-u,svg[data-mood="sleeping"] .bm-z{display:inline}
      .bm-eye{animation:bm-blink 3.8s infinite}
      @keyframes bm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1px)}}
      @keyframes bm-blink{0%,91%,100%{opacity:1}95%{opacity:.2}}
    </style>
