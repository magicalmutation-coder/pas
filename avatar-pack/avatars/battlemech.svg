      <g class="bm-m bm-s"><rect x="35" y="35" width="9" height="3" fill="#60a5fa"/><rect x="52" y="35" width="9" height="3" fill="#60a5fa"/><path d="M42 46 Q48 43 54 46" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/></g>
      <g class="bm-m bm-a"><path d="M34 33 L43 36" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M62 33 L53 36" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><rect x="35" y="36" width="9" height="3" fill="#ef4444"/><rect x="52" y="36" width="9" height="3" fill="#ef4444"/></g>
