<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Avatars - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  :root{--panel:#0c121b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  body{padding:16px}
  h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
  p{color:var(--dim2);font-size:12px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .card img{width:96px;height:96px;display:block}
  .nm{font-weight:600;font-size:12.5px}
  .hint{font-size:10.5px;color:var(--dim2)}
</style>
</head>
<body>
<h1>Extra Avatars</h1>
<p>Choose any of these in Settings &gt; Crew &gt; avatar, or on a bot's right-click picker. They install into <code>assets\avatars\</code>.</p>
<div class="grid" id="grid"></div>
<script>
const NAMES = [
  ["yeti","Yeti"],["unicorn","Unicorn"],["mermaid","Mermaid"],["kraken","Kraken"],
  ["paratrooper","Paratrooper"],["tanker","Tanker"],["grenadier","Grenadier"],
  ["battlemech","Battle Mech"],["centaur","Centaur"],["minotaur","Minotaur"],["satyr","Satyr"]
];
const g = document.getElementById("grid");
g.innerHTML = NAMES.map(([id,label]) =>
  '<div class="card"><img src="/assets/avatars/' + id + '.svg" alt="' + label + '">' +
  '<span class="nm">' + label + '</span><span class="hint">' + id + '</span></div>').join("");
</script>
</body>
</html>
