<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Avatars - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  :root{--panel:#0c121b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  body{padding:16px}
  h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
  p{color:var(--dim2);font-size:12px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .card img{width:88px;height:88px;display:block}
  .nm{font-weight:600;font-size:12px}
  .hint{font-size:10px;color:var(--dim2)}
</style>
</head>
<body>
<h1>Animal Avatars</h1>
<p>Pets and creatures: cat, dog, fish, monkey. Choose any in Settings &gt; Crew &gt; avatar, or on a bot's right-click picker.</p>
<div class="grid"><div class="card"><img src="/assets/avatars/cat.svg" alt="Cat"><span class="nm">Cat</span><span class="hint">cat</span></div><div class="card"><img src="/assets/avatars/dog.svg" alt="Dog"><span class="nm">Dog</span><span class="hint">dog</span></div><div class="card"><img src="/assets/avatars/fish.svg" alt="Fish"><span class="nm">Fish</span><span class="hint">fish</span></div><div class="card"><img src="/assets/avatars/monkey.svg" alt="Monkey"><span class="nm">Monkey</span><span class="hint">monkey</span></div></div>
</body>
</html>
