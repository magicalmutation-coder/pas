<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
:root{--panel:#0c121b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
body{display:flex;flex-direction:column;align-items:center;padding:16px}
.calc{width:min(460px,100%);border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px}
.screen{background:#06090f;border:1px solid var(--line-soft);border-radius:10px;padding:12px;margin-bottom:10px}
.expr{min-height:20px;font:13px var(--mono);color:var(--dim);word-break:break-all}
.out{font:600 30px var(--mono);color:#67e8f9;text-align:right;min-height:38px;word-break:break-all}
.hint{font:11px var(--mono);color:var(--dim2);text-align:right;min-height:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
button{font:13px var(--mono);padding:10px 0;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--txt);cursor:pointer}
button:hover{border-color:rgba(34,211,238,.45);color:#a5f3fc}
button.op{background:rgba(34,211,238,.1);color:#a5f3fc}
button.eq{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.55);color:#fff;grid-column:span 2}
button.fn{font-size:12px;color:#c4b5fd}
button.warn{color:#fecaca;border-color:rgba(248,113,113,.35)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row .seg button{border:0;border-radius:0;padding:6px 10px;background:transparent}
.row .seg button.on{background:rgba(34,211,238,.16);color:#a5f3fc}
.row .sp{flex:1 1 auto}
.kbd{font:11px var(--mono);color:var(--dim2)}
</style>
</head>
<body>
<div class="calc">
  <div class="row">
    <div class="seg" id="angle">
      <button data-mode="deg" class="on">DEG</button>
      <button data-mode="rad">RAD</button>
    </div>
    <span class="kbd">type or click · Enter = · Esc clears</span>
    <span class="sp"></span>
    <span class="kbd" id="mem">M 0</span>
  </div>
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="out" id="out">0</div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="grid" id="pad"></div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let EXPR = "";
let ANGLE = "deg";
let MEM = 0;
let LAST = "";

const KEYS = [
  ["sin", "fn", "sin("], ["cos", "fn", "cos("], ["tan", "fn", "tan("], ["log", "fn", "log("], ["ln", "fn", "ln("], ["sqrt", "fn", "sqrt("],
  ["x^y", "fn", "^"], ["x!", "fn", "!"], ["(", "op", "("], [")", "op", ")"], ["π", "fn", "pi"], ["e", "fn", "e"],
  ["7", "", "7"], ["8", "", "8"], ["9", "", "9"], ["÷", "op", "/"], ["mod", "op", "%"], ["C", "warn", "clear"],
  ["4", "", "4"], ["5", "", "5"], ["6", "", "6"], ["×", "op", "*"], ["M+", "op", "mplus"], ["M-", "op", "mminus"],
  ["1", "", "1"], ["2", "", "2"], ["3", "", "3"], ["−", "op", "-"], ["MR", "op", "mr"], ["MC", "op", "mc"],
  ["0", "", "0"], [".", "", "."], ["±", "op", "neg"], ["+", "op", "+"], ["⌫", "warn", "back"], ["=", "eq", "="]
];

function renderPad(){
  $("pad").innerHTML = KEYS.map(([label, cls, act]) =>
    '<button type="button" class="' + cls + '" data-act="' + act + '">' + label + '</button>').join("");
}

function setExpr(v){ EXPR = v; $("expr").textContent = EXPR || ""; }

function calculate(src){
  const s = String(src).trim();
  if(!s) return null;
  let i = 0;
  const toRad = x => ANGLE === "rad" ? x : x * Math.PI / 180;
  function ws(){ while(i < s.length && /\s/.test(s[i])) i++; }
  function peek(){ ws(); return s[i]; }
  function eat(ch){ ws(); if(s[i] === ch){ i++; return true; } return false; }
  function num(){
    ws();
    let start = i;
    while(i < s.length && /[0-9.]/.test(s[i])) i++;
    if(start === i) throw new Error("number expected");
    return parseFloat(s.slice(start, i));
  }
  function ident(){
    ws();
    let start = i;
    while(i < s.length && /[a-z]/i.test(s[i])) i++;
    return s.slice(start, i).toLowerCase();
  }
  function factor(){
    ws();
    if(eat("(")){ const v = expression(); if(!eat(")")) throw new Error("missing )"); return v; }
    if(eat("-")) return -factor();
    if(eat("+")) return factor();
    const c = peek();
    if(/[0-9.]/.test(c)) return num();
    if(/[a-z]/i.test(c)){
      const name = ident();
      if(name === "pi") return Math.PI;
      if(name === "e") return Math.E;
      eat("(");
      const arg = expression();
      eat(")");
      switch(name){
        case "sin": return Math.sin(toRad(arg));
        case "cos": return Math.cos(toRad(arg));
        case "tan": return Math.tan(toRad(arg));
        case "asin": return ANGLE === "rad" ? Math.asin(arg) : Math.asin(arg) * 180 / Math.PI;
        case "acos": return ANGLE === "rad" ? Math.acos(arg) : Math.acos(arg) * 180 / Math.PI;
        case "atan": return ANGLE === "rad" ? Math.atan(arg) : Math.atan(arg) * 180 / Math.PI;
        case "log": return Math.log10(arg);
        case "ln": return Math.log(arg);
        case "sqrt": return Math.sqrt(arg);
        case "abs": return Math.abs(arg);
        case "exp": return Math.exp(arg);
        default: throw new Error("unknown function " + name);
      }
    }
    throw new Error("unexpected '" + (c || "end") + "'");
  }
  function power(){
    let base = factor();
    ws();
    if(s[i] === "^"){ i++; const exp = power(); base = Math.pow(base, exp); }
    return base;
  }
  function unaryPostfix(){
    let v = power();
    ws();
    while(s[i] === "!"){ i++; v = fact(v); ws(); }
    return v;
  }
  function term(){
    let v = unaryPostfix();
    for(;;){
      ws();
      if(s[i] === "*"){ i++; v *= unaryPostfix(); }
      else if(s[i] === "/"){ i++; v /= unaryPostfix(); }
      else if(s[i] === "%"){ i++; v %= unaryPostfix(); }
      else return v;
    }
  }
  function expression(){
    let v = term();
    for(;;){
      ws();
      if(s[i] === "+"){ i++; v += term(); }
      else if(s[i] === "-"){ i++; v -= term(); }
      else return v;
    }
  }
  function fact(n){
    if(n < 0 || Math.floor(n) !== n || n > 170) throw new Error("factorial needs a whole number 0-170");
    let r = 1; for(let k = 2; k <= n; k++) r *= k; return r;
  }
  const v = expression();
  ws();
  if(i < s.length) throw new Error("unexpected '" + s[i] + "'");
  if(!isFinite(v)) throw new Error("not a finite number");
  return v;
}

function fmt(v){
  if(v === null || v === undefined) return "0";
  if(!isFinite(v)) return "∞";
  const a = Math.abs(v);
  if(a !== 0 && (a >= 1e12 || a < 1e-9)) return v.toExponential(8);
  return String(parseFloat(v.toPrecision(12)));
}

function preview(){
  try {
    const v = calculate(EXPR);
    $("out").textContent = v === null ? "0" : fmt(v);
    $("hint").textContent = "";
  } catch(e){
    $("out").textContent = "—";
    $("hint").textContent = e.message;
  }
}

function press(act){
  if(act === "clear"){ setExpr(""); LAST = ""; $("out").textContent = "0"; $("hint").textContent = ""; return; }
  if(act === "back"){ setExpr(EXPR.slice(0, -1)); preview(); return; }
  if(act === "neg"){ setExpr(EXPR ? "-(" + EXPR + ")" : "-"); preview(); return; }
  if(act === "mplus"){ try { MEM += calculate(EXPR) || 0; } catch(e){} $("mem").textContent = "M " + fmt(MEM); return; }
  if(act === "mminus"){ try { MEM -= calculate(EXPR) || 0; } catch(e){} $("mem").textContent = "M " + fmt(MEM); return; }
  if(act === "mr"){ setExpr(EXPR + fmt(MEM)); preview(); return; }
  if(act === "mc"){ MEM = 0; $("mem").textContent = "M 0"; return; }
  if(act === "="){
    try {
      const v = calculate(EXPR);
      LAST = EXPR;
      $("expr").textContent = LAST + " =";
      $("out").textContent = fmt(v);
      $("hint").textContent = "";
      EXPR = "";
    } catch(e){
      $("hint").textContent = e.message;
    }
    return;
  }
  setExpr(EXPR + act);
  preview();
}

renderPad();
$("pad").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if(b) press(b.dataset.act);
});
$("angle").addEventListener("click", ev => {
  const b = ev.target.closest("[data-mode]");
  if(!b) return;
  ANGLE = b.dataset.mode;
  [...$("angle").querySelectorAll("button")].forEach(x => x.classList.toggle("on", x.dataset.mode === ANGLE));
  preview();
});
document.addEventListener("keydown", ev => {
  const k = ev.key;
  if(/^[0-9.+\-*/^()!%]$/.test(k)) { setExpr(EXPR + k); preview(); ev.preventDefault(); }
  else if(k === "Enter"){ press("="); ev.preventDefault(); }
  else if(k === "Backspace"){ press("back"); ev.preventDefault(); }
  else if(k === "Escape"){ press("clear"); ev.preventDefault(); }
});
preview();
</script>
</body>
</html>
