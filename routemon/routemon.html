<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Monitor</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  /* colour tokens come from /assets/theme.css - do not copy the :root block back */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  header{display:flex;gap:12px;align-items:baseline;padding:11px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px}
  header .hint{color:var(--dim2);font-size:11.5px}
  header .spacer{flex:1 1 auto}
  header a{color:var(--dim);font-size:11.5px;text-decoration:none;border:1px solid var(--line);
           padding:3px 9px;border-radius:999px}
  header a:hover{color:var(--txt);border-color:rgba(34,211,238,.4)}
  main{padding:14px 16px;display:grid;gap:14px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  section h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .find{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin-bottom:8px;
        background:var(--panel2);border:1px solid var(--line)}
  .find.high{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.07)}
  .find.watch{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)}
  .sev{font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:2px;min-width:46px}
  .high .sev{color:var(--red)} .watch .sev{color:var(--amber)} .info .sev{color:var(--dim2)}
  .find b{display:block;font-size:12.5px}
  .find .d{color:var(--dim);font-size:11.5px;margin-top:2px}
  .find .s{color:var(--dim2);font-size:11px;margin-top:4px;font-family:var(--mono)}
  .empty{color:var(--dim2);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;color:var(--dim2);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
     padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  td.mono{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font:10.5px var(--mono)}
  .pill.same{background:rgba(52,211,153,.14);color:var(--green)}
  .pill.diff{background:rgba(251,191,36,.16);color:var(--amber)}
  #status{color:var(--dim2);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>Route Monitor</h1>
  <span class="hint">what the log says about how work is delegated</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <a href="/crewmap" target="_top">crew map</a>
  <a class="back" href="/" target="_top">dashboard</a>
</header>
<main>
  <section>
    <h2>Findings</h2>
    <div id="findings"><div class="empty">reading…</div></div>
  </section>
  <section>
    <h2>Recent delegations</h2>
    <div id="routes"><div class="empty">reading…</div></div>
  </section>
  <section style="grid-column:1/-1">
    <h2>By bot</h2>
    <div id="bybot"><div class="empty">reading…</div></div>
  </section>
</main>
<script>
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
function ago(at) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - Number(at || 0)));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

async function load() {
  try {
    const f = await fetch("/api/crew/findings?days=7", { cache: "no-store" }).then(x => x.json());
    const list = (f && f.findings) || [];
    const box = document.getElementById("findings");
    if (!list.length) {
      box.innerHTML = '<div class="empty">nothing to report: every delegation in the last week either matched a bot, or none were logged. That is the good outcome - it means the cues are doing their job.</div>';
    } else {
      box.innerHTML = list.map(x =>
        '<div class="find ' + esc(x.severity) + '">' +
          '<span class="sev">' + esc(x.severity) + "</span>" +
          "<div><b>" + esc(x.title) + "</b>" +
          '<div class="d">' + esc(x.detail) + "</div>" +
          (x.sample ? '<div class="s">' + esc(x.sample) + "</div>" : "") +
          "</div></div>").join("");
    }
    document.getElementById("status").textContent =
      list.length + " finding(s) · " + ((f && f.days) || 7) + " day window";
  } catch (e) {
    document.getElementById("status").textContent = "app not answering";
  }

  try {
    const r = await fetch("/api/crew/routes?days=7", { cache: "no-store" }).then(x => x.json());
    const rows = (r && r.rows) || [];
    const box = document.getElementById("routes");
    if (!rows.length) {
      box.innerHTML = '<div class="empty">no delegations logged yet - one appears each time the foreman uses ask_agent.</div>';
    } else {
      box.innerHTML = '<table><thead><tr><th>when</th><th>suggested</th><th>asked</th><th>score</th><th>cues</th></tr></thead><tbody>' +
        rows.slice(0, 40).map(x => {
          const same = !x.suggested || x.suggested === x.chosen;
          return "<tr><td class=\"mono\">" + ago(x.at) + "</td>" +
            "<td>" + esc(x.suggested || "-") + "</td>" +
            "<td>" + esc(x.chosen || "-") + " <span class=\"pill " + (same ? "same" : "diff") + "\">" + (same ? "agreed" : "differed") + "</span></td>" +
            "<td class=\"mono\">" + esc(x.score) + "</td>" +
            "<td class=\"mono\">" + esc(x.cues || "-") + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    const bybox = document.getElementById("bybot");
    const by = (r && r.byBot) || [];
    bybox.innerHTML = by.length
      ? by.map(b => '<span class="pill same" style="margin-right:6px">' + esc(b.bot) + " " + esc(b.n) + "</span>").join("")
      : '<div class="empty">nothing yet</div>';
  } catch (e) { }
}

load();
setInterval(load, 6000);
</script>
</body>
</html>
