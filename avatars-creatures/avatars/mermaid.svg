      <g class="mm-m mm-h"><path d="M41 46 q2-2.4 4 0" fill="none" stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/><path d="M51 46 q2-2.4 4 0" fill="none" stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/><path d="M45 51 q3 2 6 0" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="mm-m mm-s"><circle cx="43" cy="46" r="1.6" fill="#0e7490"/><circle cx="53" cy="46" r="1.6" fill="#0e7490"/><path d="M45 52 q3-2 6 0" fill="none" stroke="#0e7490" stroke-width="1.1" stroke-linecap="round"/></g>
