<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .mm-b{transform-box:fill-box;transform-origin:50% 100%;animation:mm-bob 3.2s ease-in-out infinite}
      .mm-m{display:none}
      svg[data-mood="neutral"] .mm-n,svg[data-mood="happy"] .mm-h,svg[data-mood="sad"] .mm-s,svg[data-mood="angry"] .mm-a,svg[data-mood="surprised"] .mm-u,svg[data-mood="sleeping"] .mm-z{display:inline}
      .mm-eye{animation:mm-blink 4.2s infinite}
      @keyframes mm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
      @keyframes mm-blink{0%,92%,100%{opacity:1}95%{opacity:.2}}
    </style>
