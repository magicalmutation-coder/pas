      .vp-eye{animation:vp-blink 5s infinite}
      @keyframes vp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
      @keyframes vp-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
