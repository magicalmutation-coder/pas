      svg[data-mood="neutral"] .mu-n,svg[data-mood="happy"] .mu-h,svg[data-mood="sad"] .mu-s,svg[data-mood="angry"] .mu-a,svg[data-mood="surprised"] .mu-u,svg[data-mood="sleeping"] .mu-z{display:inline}
      .mu-eye{animation:mu-glow 2.4s ease-in-out infinite}
      @keyframes mu-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes mu-glow{0%,100%{opacity:.6}50%{opacity:1}}
    </style>
