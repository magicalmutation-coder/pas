      <g class="mu-m mu-s"><circle cx="43" cy="46" r="1.6" fill="#60a5fa"/><circle cx="53" cy="46" r="1.6" fill="#60a5fa"/><path d="M45 54 q3-2 6 0" fill="none" stroke="#8a7a55" stroke-width="1.2" stroke-linecap="round"/></g>
