<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Workman</title>
    <style>
      .wk-body{transform-box:fill-box;transform-origin:50% 100%;animation:wk-bob 2.8s ease-in-out infinite}
      .wk-mood{display:none}
      svg[data-mood="neutral"] .wk-mood-n,svg[data-mood="happy"] .wk-mood-h,svg[data-mood="sad"] .wk-mood-s,svg[data-mood="angry"] .wk-mood-a,svg[data-mood="surprised"] .wk-mood-u,svg[data-mood="sleeping"] .wk-mood-z{display:inline}
      .wk-eye{transform-box:fill-box;transform-origin:50% 50%;animation:wk-blink 4s infinite}
      @keyframes wk-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes wk-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      @media(prefers-reduced-motion:reduce){.wk-body,.wk-eye{animation:none}}
    </style>
    <g class="wk-body">
      <path d="M48 58 C36 58 26 66 24 94 h48 C70 66 60 58 48 58Z" fill="#f59e0b"/>
      <rect x="36" y="62" width="24" height="8" rx="2" fill="#92400e"/>
      <ellipse cx="48" cy="44" rx="13" ry="14" fill="#f2ddc4"/>
      <!-- hard hat -->
      <path d="M30 38 C30 26 40 20 48 20 C56 20 66 26 66 38 L66 42 L30 42 Z" fill="#fbbf24"/>
      <rect x="28" y="40" width="40" height="5" rx="2" fill="#d97706"/>
      <path d="M44 22 L44 14 M52 22 L52 14" stroke="#92400e" stroke-width="1.5"/>
      <g class="wk-mood wk-mood-n">
        <ellipse class="wk-eye" cx="43" cy="44" rx="1.8" ry="2.2" fill="#1c1917"/>
        <ellipse class="wk-eye" cx="53" cy="44" rx="1.8" ry="2.2" fill="#1c1917"/>
        <path d="M44 50 L52 50" stroke="#7a4a3a" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="wk-mood wk-mood-h" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 45 q2-2.4 4 0"/><path d="M51 45 q2-2.4 4 0"/>
        <path d="M44 50 Q48 53 52 50" stroke="#7a4a3a"/>
      </g>
      <g class="wk-mood wk-mood-s">
        <ellipse class="wk-eye" cx="43" cy="45" rx="1.7" ry="2" fill="#1c1917"/>
        <ellipse class="wk-eye" cx="53" cy="45" rx="1.7" ry="2" fill="#1c1917"/>
        <path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="wk-mood wk-mood-a">
        <path d="M40 42 L46 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 42 L50 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="wk-eye" cx="43" cy="45" rx="1.7" ry="2" fill="#1c1917"/>
        <ellipse class="wk-eye" cx="53" cy="45" rx="1.7" ry="2" fill="#1c1917"/>
        <path d="M44 51 Q48 49 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="wk-mood wk-mood-u">
        <ellipse class="wk-eye" cx="43" cy="44" rx="2.2" ry="2.8" fill="#1c1917"/>
        <ellipse class="wk-eye" cx="53" cy="44" rx="2.2" ry="2.8" fill="#1c1917"/>
        <ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#7a4a3a"/>
      </g>
      <g class="wk-mood wk-mood-z">
        <path d="M40 44 Q43 46 46 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 44 Q53 46 56 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="51" rx="2" ry="1.2" fill="#7a4a3a"/>
      </g>
      <!-- hammer -->
      <g transform="translate(74,58) rotate(-20)">
        <rect x="-2" y="-24" width="4" height="24" fill="#8b5a2b"/>
        <rect x="-8" y="-30" width="16" height="8" rx="2" fill="#78716c"/>
      </g>
    </g>
  </svg>