<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Slime</title>
    <style>
      .sl-body{transform-box:fill-box;transform-origin:50% 100%;animation:sl-bob 2.4s ease-in-out infinite}
      .sl-mood{display:none}
      svg[data-mood="neutral"] .sl-mood-n,svg[data-mood="happy"] .sl-mood-h,svg[data-mood="sad"] .sl-mood-s,svg[data-mood="angry"] .sl-mood-a,svg[data-mood="surprised"] .sl-mood-u,svg[data-mood="sleeping"] .sl-mood-z{display:inline}
      .sl-eye{transform-box:fill-box;transform-origin:50% 50%;animation:sl-blink 3.6s infinite}
      .sl-bubble{animation:sl-pop 2s ease-in-out infinite}
      @keyframes sl-bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.04)}}
      @keyframes sl-blink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
      @keyframes sl-pop{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
      @media(prefers-reduced-motion:reduce){.sl-body,.sl-eye,.sl-bubble{animation:none}}
    </style>
    <g class="sl-body">
      <ellipse cx="48" cy="78" rx="26" ry="8" fill="#16a34a" opacity=".4"/>
      <path d="M22 78 C22 56 32 40 48 40 C64 40 74 56 74 78 Z" fill="#22c55e"/>
      <ellipse cx="48" cy="52" rx="18" ry="16" fill="#4ade80" opacity=".6"/>
      <g class="sl-mood sl-mood-n">
        <ellipse class="sl-eye" cx="40" cy="58" rx="3" ry="3.6" fill="#14532d"/>
        <ellipse class="sl-eye" cx="56" cy="58" rx="3" ry="3.6" fill="#14532d"/>
        <circle cx="40.8" cy="57" r="1" fill="#fff"/>
        <circle cx="56.8" cy="57" r="1" fill="#fff"/>
        <path d="M42 66 Q48 68 54 66" fill="none" stroke="#14532d" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <g class="sl-mood sl-mood-h" fill="none" stroke="#14532d" stroke-width="1.8" stroke-linecap="round">
        <path d="M37 59 q3-3 6 0"/><path d="M53 59 q3-3 6 0"/>
        <path d="M42 66 Q48 70 54 66"/>
      </g>
      <g class="sl-mood sl-mood-s">
        <ellipse class="sl-eye" cx="40" cy="59" rx="2.8" ry="3.2" fill="#14532d"/>
        <ellipse class="sl-eye" cx="56" cy="59" rx="2.8" ry="3.2" fill="#14532d"/>
        <path d="M42 67 Q48 64 54 67" fill="none" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="sl-mood sl-mood-a">
        <path d="M37 56 L43 58" stroke="#14532d" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M59 56 L53 58" stroke="#14532d" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <ellipse class="sl-eye" cx="40" cy="59" rx="2.8" ry="3.2" fill="#14532d"/>
        <ellipse class="sl-eye" cx="56" cy="59" rx="2.8" ry="3.2" fill="#14532d"/>
        <path d="M42 67 Q48 65 54 67" fill="none" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="sl-mood sl-mood-u">
        <ellipse class="sl-eye" cx="40" cy="58" rx="3.6" ry="4.2" fill="#14532d"/>
        <ellipse class="sl-eye" cx="56" cy="58" rx="3.6" ry="4.2" fill="#14532d"/>
        <ellipse cx="48" cy="67" rx="2.6" ry="2.8" fill="#14532d"/>
      </g>
      <g class="sl-mood sl-mood-z">
        <path d="M37 58 Q40 60 43 58" fill="none" stroke="#14532d" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M53 58 Q56 60 59 58" fill="none" stroke="#14532d" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="48" cy="67" rx="2.2" ry="1.4" fill="#14532d"/>
      </g>
      <circle class="sl-bubble" cx="28" cy="46" r="2" fill="#86efac"/>
      <circle class="sl-bubble" cx="70" cy="50" r="1.6" fill="#86efac" style="animation-delay:.6s"/>
    </g>
  </svg>