<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Fairy</title>
    <style>
      .fy-body{transform-box:fill-box;transform-origin:50% 100%;animation:fy-bob 2.6s ease-in-out infinite}
      .fy-mood{display:none}
      svg[data-mood="neutral"] .fy-mood-n,svg[data-mood="happy"] .fy-mood-h,svg[data-mood="sad"] .fy-mood-s,svg[data-mood="angry"] .fy-mood-a,svg[data-mood="surprised"] .fy-mood-u,svg[data-mood="sleeping"] .fy-mood-z{display:inline}
      .fy-eye{transform-box:fill-box;transform-origin:50% 50%;animation:fy-blink 3.8s infinite}
      .fy-wing{transform-box:fill-box;transform-origin:50% 50%;animation:fy-flap 2.2s ease-in-out infinite}
      .fy-spark{animation:fy-twk 2s ease-in-out infinite}
      @keyframes fy-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes fy-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      @keyframes fy-flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.85)}}
      @keyframes fy-twk{0%,100%{opacity:.3}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.fy-body,.fy-eye,.fy-wing,.fy-spark{animation:none}}
    </style>
    <g class="fy-body">
      <!-- wings -->
      <g class="fy-wing">
        <path d="M30 46 C18 34 16 52 28 58 Z" fill="#f0abfc" opacity=".7"/>
        <path d="M66 46 C78 34 80 52 68 58 Z" fill="#f0abfc" opacity=".7"/>
        <path d="M30 46 C22 40 20 50 28 56" fill="none" stroke="#e879f9" stroke-width="1"/>
        <path d="M66 46 C74 40 76 50 68 56" fill="none" stroke="#e879f9" stroke-width="1"/>
      </g>
      <path d="M48 60 C38 60 30 66 28 94 h40 C66 66 58 60 48 60Z" fill="#fbcfe8"/>
      <ellipse cx="48" cy="46" rx="11" ry="13" fill="#fde68a"/>
      <!-- hair -->
      <path d="M37 36 Q48 24 59 36 Q57 30 48 28 Q39 30 37 36Z" fill="#f0abfc"/>
      <!-- wand -->
      <g transform="translate(76,48) rotate(-25)">
        <line x1="0" y1="0" x2="0" y2="26" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3" fill="#f0abfc" stroke="#e879f9" stroke-width="1"/>
      </g>
      <g class="fy-mood fy-mood-n">
        <ellipse class="fy-eye" cx="43" cy="46" rx="1.7" ry="2.2" fill="#7c3aed"/>
        <ellipse class="fy-eye" cx="53" cy="46" rx="1.7" ry="2.2" fill="#7c3aed"/>
        <path d="M44 52 Q48 54 52 52" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="fy-mood fy-mood-h" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 47 q2-2.4 4 0"/><path d="M51 47 q2-2.4 4 0"/>
        <path d="M44 52 Q48 55 52 52"/>
      </g>
      <g class="fy-mood fy-mood-s">
        <ellipse class="fy-eye" cx="43" cy="47" rx="1.6" ry="2" fill="#7c3aed"/>
        <ellipse class="fy-eye" cx="53" cy="47" rx="1.6" ry="2" fill="#7c3aed"/>
        <path d="M44 53 Q48 50 52 53" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="fy-mood fy-mood-a">
        <path d="M40 44 L46 46" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 44 L50 46" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="fy-eye" cx="43" cy="47" rx="1.6" ry="2" fill="#7c3aed"/>
        <ellipse class="fy-eye" cx="53" cy="47" rx="1.6" ry="2" fill="#7c3aed"/>
        <path d="M44 53 Q48 51 52 53" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="fy-mood fy-mood-u">
        <ellipse class="fy-eye" cx="43" cy="46" rx="2.2" ry="2.8" fill="#7c3aed"/>
        <ellipse class="fy-eye" cx="53" cy="46" rx="2.2" ry="2.8" fill="#7c3aed"/>
        <ellipse cx="48" cy="53" rx="2" ry="2.2" fill="#7c3aed"/>
      </g>
      <g class="fy-mood fy-mood-z">
        <path d="M40 46 Q43 48 46 46" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 46 Q53 48 56 46" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="53" rx="2" ry="1.2" fill="#7c3aed"/>
      </g>
      <circle class="fy-spark" cx="20" cy="24" r="1.6" fill="#f0abfc"/>
      <circle class="fy-spark" cx="76" cy="30" r="1.2" fill="#fbbf24" style="animation-delay:.7s"/>
    </g>
  </svg>