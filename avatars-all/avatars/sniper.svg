      <g class="sn-m sn-s"><circle cx="44" cy="47" r="1.4" fill="#1c1917"/><circle cx="52" cy="47" r="1.4" fill="#1c1917"/><path d="M45 52 Q48 49 51 52" fill="none" stroke="#7a4a3a" stroke-width="1.1" stroke-linecap="round"/></g>
