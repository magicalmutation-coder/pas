<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .sn-b{transform-box:fill-box;transform-origin:50% 100%;animation:sn-bob 3.6s ease-in-out infinite}
      .sn-m{display:none}
      svg[data-mood="neutral"] .sn-n,svg[data-mood="happy"] .sn-h,svg[data-mood="sad"] .sn-s,svg[data-mood="angry"] .sn-a,svg[data-mood="surprised"] .sn-u,svg[data-mood="sleeping"] .sn-z{display:inline}
      .sn-eye{animation:sn-blink 5s infinite}
      @keyframes sn-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes sn-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
    </style>
