      <circle cx="18" cy="33" r="2.4" fill="#22d3ee"/><circle cx="78" cy="33" r="2.4" fill="#22d3ee"/>
      <circle cx="48" cy="52" r="12" fill="#0f172a"/>
      <g class="pb-m pb-n"><circle class="pb-eye" cx="48" cy="52" r="5" fill="#22d3ee"/><circle cx="48" cy="52" r="2" fill="#0f172a"/><path d="M42 64 h12" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="pb-m pb-h"><path d="M43 54 q5 5 10-1" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/><circle cx="48" cy="48" r="2" fill="#34d399"/></g>
      <g class="pb-m pb-s"><circle cx="48" cy="53" r="4.4" fill="#60a5fa"/><path d="M43 57 q5-4 10 0" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/></g>
      <g class="pb-m pb-a"><circle cx="48" cy="52" r="5" fill="#ef4444"/><circle cx="48" cy="52" r="2" fill="#0f172a"/><path d="M41 44 L48 48 L55 44" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/></g>
      <g class="pb-m pb-u"><circle cx="48" cy="52" r="6.4" fill="#fbbf24"/><circle cx="48" cy="52" r="2.6" fill="#0f172a"/></g>
      <g class="pb-m pb-z"><path d="M42 52 h12" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/><path d="M44 57 h8" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" opacity=".5"/></g>
    </g>
  </svg>