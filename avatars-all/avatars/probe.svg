<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .pb-b{transform-box:fill-box;transform-origin:50% 50%;animation:pb-float 2.6s ease-in-out infinite}
      .pb-m{display:none}
      svg[data-mood="neutral"] .pb-n,svg[data-mood="happy"] .pb-h,svg[data-mood="sad"] .pb-s,svg[data-mood="angry"] .pb-a,svg[data-mood="surprised"] .pb-u,svg[data-mood="sleeping"] .pb-z{display:inline}
      .pb-eye{animation:pb-blink 3.4s infinite}
      @keyframes pb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes pb-blink{0%,90%,100%{opacity:1}94%{opacity:.2}}
    </style>
    <g class="pb-b">
      <path d="M48 30 C30 30 22 44 24 58 C26 70 36 74 48 74 C60 74 70 70 72 58 C74 44 66 30 48 30Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
