<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .mc-b{transform-box:fill-box;transform-origin:50% 100%;animation:mc-bob 3.4s ease-in-out infinite}
      .mc-m{display:none}
      svg[data-mood="neutral"] .mc-n,svg[data-mood="happy"] .mc-h,svg[data-mood="sad"] .mc-s,svg[data-mood="angry"] .mc-a,svg[data-mood="surprised"] .mc-u,svg[data-mood="sleeping"] .mc-z{display:inline}
      .mc-eye{animation:mc-blink 3.6s infinite}
      @keyframes mc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes mc-blink{0%,90%,100%{opacity:1}94%{opacity:.2}}
    </style>
