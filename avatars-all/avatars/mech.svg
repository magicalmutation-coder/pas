      <g class="mc-m mc-h"><path d="M34 36 L37 32 L40 36" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/><path d="M56 36 L59 32 L62 36" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/><path d="M42 45 Q48 49 54 45" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/></g>
      <g class="mc-m mc-s"><rect class="mc-eye" x="34" y="34" width="7" height="4" rx="1" fill="#60a5fa"/><rect class="mc-eye" x="55" y="34" width="7" height="4" rx="1" fill="#60a5fa"/><path d="M42 46 Q48 43 54 46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/></g>
      <g class="mc-m mc-a"><path d="M33 32 L41 35" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M63 32 L55 35" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none"/><rect class="mc-eye" x="34" y="35" width="7" height="4" rx="1" fill="#ef4444"/><rect class="mc-eye" x="55" y="35" width="7" height="4" rx="1" fill="#ef4444"/><path d="M42 46 Q48 44 54 46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/></g>
      <g class="mc-m mc-u"><rect class="mc-eye" x="34" y="33" width="8" height="7" rx="1" fill="#fbbf24"/><rect class="mc-eye" x="54" y="33" width="8" height="7" rx="1" fill="#fbbf24"/><ellipse cx="48" cy="46" rx="3" ry="2.6" fill="#334155"/></g>
      <g class="mc-m mc-z"><rect x="34" y="35" width="7" height="2" fill="#fbbf24"/><rect x="55" y="35" width="7" height="2" fill="#fbbf24"/><rect x="42" y="46" width="12" height="2" fill="#334155"/></g>
