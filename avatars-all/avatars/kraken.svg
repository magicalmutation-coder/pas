<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .kk-b{transform-box:fill-box;transform-origin:50% 50%;animation:kk-float 3s ease-in-out infinite}
      .kk-m{display:none}
      svg[data-mood="neutral"] .kk-n,svg[data-mood="happy"] .kk-h,svg[data-mood="sad"] .kk-s,svg[data-mood="angry"] .kk-a,svg[data-mood="surprised"] .kk-u,svg[data-mood="sleeping"] .kk-z{display:inline}
      .kk-eye{animation:kk-blink 4.6s infinite}
      .kk-tent{transform-box:fill-box;transform-origin:50% 0;animation:kk-wave 2.6s ease-in-out infinite}
      @keyframes kk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
      @keyframes kk-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
      @keyframes kk-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
    </style>
    <g class="kk-b">
      <g class="kk-tent" style="transform-origin:48px 62px"><path d="M30 60 Q22 76 28 90 M38 62 Q34 80 40 92 M58 62 Q62 80 56 92 M66 60 Q74 76 68 90" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="round"/></g>
      <ellipse cx="48" cy="44" rx="21" ry="18" fill="#9333ea"/>
      <ellipse cx="48" cy="52" rx="15" ry="10" fill="#a855f7" opacity=".5"/>
      <g class="kk-m kk-n"><ellipse class="kk-eye" cx="40" cy="42" rx="3.4" ry="4" fill="#fef3c7"/><ellipse class="kk-eye" cx="56" cy="42" rx="3.4" ry="4" fill="#fef3c7"/><circle cx="40" cy="43" r="1.8" fill="#1c1917"/><circle cx="56" cy="43" r="1.8" fill="#1c1917"/><path d="M44 52 Q48 54 52 52" fill="none" stroke="#581c87" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="kk-m kk-h"><path d="M36 43 q3-3 6 0" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/><path d="M54 43 q3-3 6 0" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/><path d="M44 52 q4 3 8 0" fill="none" stroke="#581c87" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="kk-m kk-s"><ellipse cx="40" cy="43" rx="3" ry="3.6" fill="#fef3c7"/><ellipse cx="56" cy="43" rx="3" ry="3.6" fill="#fef3c7"/><path d="M44 53 q4-2 8 0" fill="none" stroke="#581c87" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="kk-m kk-a"><path d="M35 38 L42 41" stroke="#581c87" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M61 38 L54 41" stroke="#581c87" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="40" cy="43" rx="3" ry="3.6" fill="#ef4444"/><ellipse cx="56" cy="43" rx="3" ry="3.6" fill="#ef4444"/></g>
      <g class="kk-m kk-u"><ellipse cx="40" cy="42" rx="4" ry="4.8" fill="#fef3c7"/><ellipse cx="56" cy="42" rx="4" ry="4.8" fill="#fef3c7"/><circle cx="40" cy="43" r="2.2" fill="#1c1917"/><circle cx="56" cy="43" r="2.2" fill="#1c1917"/><ellipse cx="48" cy="53" rx="2.6" ry="2.8" fill="#581c87"/></g>
      <g class="kk-m kk-z"><path d="M36 42 h7" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/><path d="M53 42 h7" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/><ellipse cx="48" cy="53" rx="2.2" ry="1.4" fill="#581c87"/></g>
