<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .dv-b{transform-box:fill-box;transform-origin:50% 100%;animation:dv-bob 3s ease-in-out infinite}
      .dv-m{display:none}
      svg[data-mood="neutral"] .dv-n,svg[data-mood="happy"] .dv-h,svg[data-mood="sad"] .dv-s,svg[data-mood="angry"] .dv-a,svg[data-mood="surprised"] .dv-u,svg[data-mood="sleeping"] .dv-z{display:inline}
      .dv-eye{animation:dv-blink 4.6s infinite}
      .dv-gear{transform-box:fill-box;transform-origin:50% 50%;animation:dv-spin 6s linear infinite}
      @keyframes dv-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
      @keyframes dv-blink{0%,93%,100%{opacity:1}96%{opacity:.2}}
      @keyframes dv-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
    <g class="dv-b">
      <g class="dv-gear" style="transform-origin:80px 66px"><circle cx="80" cy="66" r="6" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/></g>
