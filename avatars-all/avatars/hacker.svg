      <g class="hk-m hk-s"><circle cx="43" cy="45" r="1.5" fill="#60a5fa"/><circle cx="53" cy="45" r="1.5" fill="#60a5fa"/><path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/></g>
