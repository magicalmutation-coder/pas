<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .hk-b{transform-box:fill-box;transform-origin:50% 100%;animation:hk-bob 2.8s ease-in-out infinite}
      .hk-m{display:none}
      svg[data-mood="neutral"] .hk-n,svg[data-mood="happy"] .hk-h,svg[data-mood="sad"] .hk-s,svg[data-mood="angry"] .hk-a,svg[data-mood="surprised"] .hk-u,svg[data-mood="sleeping"] .hk-z{display:inline}
      .hk-eye{animation:hk-blink 5s infinite}
      .hk-scr{animation:hk-flick 1.2s steps(2) infinite}
      @keyframes hk-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
      @keyframes hk-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
      @keyframes hk-flick{0%,100%{opacity:.85}50%{opacity:1}}
    </style>
