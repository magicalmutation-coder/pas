<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Elf</title>
    <style>
      .elf-body{transform-box:fill-box;transform-origin:50% 100%;animation:elf-bob 3s ease-in-out infinite}
      .elf-mood{display:none}
      svg[data-mood="neutral"] .elf-mood-n,svg[data-mood="happy"] .elf-mood-h,svg[data-mood="sad"] .elf-mood-s,svg[data-mood="angry"] .elf-mood-a,svg[data-mood="surprised"] .elf-mood-u,svg[data-mood="sleeping"] .elf-mood-z{display:inline}
      .elf-eye{transform-box:fill-box;transform-origin:50% 50%;animation:elf-blink 4s infinite}
      .elf-glow{animation:elf-twk 2.4s ease-in-out infinite}
      @keyframes elf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes elf-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      @keyframes elf-twk{0%,100%{opacity:.3}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.elf-body,.elf-eye,.elf-glow{animation:none}}
    </style>
    <g class="elf-body">
      <path d="M48 60 C38 60 30 66 28 94 h40 C66 66 58 60 48 60Z" fill="#1f6f5a"/>
      <ellipse cx="48" cy="46" rx="12" ry="14" fill="#f2ddc4"/>
      <path d="M36 44 L28 30 L36 40 Z" fill="#f2ddc4"/>
      <path d="M60 44 L68 30 L60 40 Z" fill="#f2ddc4"/>
      <path d="M36 38 Q48 26 60 38 Q58 30 48 28 Q38 30 36 38Z" fill="#7dd3c0"/>
      <!-- neutral -->
      <g class="elf-mood elf-mood-n" fill="#1f6f5a">
        <ellipse class="elf-eye" cx="43" cy="46" rx="1.8" ry="2.4"/>
        <ellipse class="elf-eye" cx="53" cy="46" rx="1.8" ry="2.4"/>
        <path d="M44 52 Q48 54 52 52" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <!-- happy -->
      <g class="elf-mood elf-mood-h" fill="none" stroke="#1f6f5a" stroke-width="1.8" stroke-linecap="round">
        <path d="M41 47 q2-2.6 4 0"/><path d="M51 47 q2-2.6 4 0"/>
        <path d="M44 52 Q48 56 52 52" stroke="#7a4a3a"/>
      </g>
      <!-- sad -->
      <g class="elf-mood elf-mood-s">
        <ellipse class="elf-eye" cx="43" cy="47" rx="1.7" ry="2" fill="#1f6f5a"/>
        <ellipse class="elf-eye" cx="53" cy="47" rx="1.7" ry="2" fill="#1f6f5a"/>
        <path d="M44 53 Q48 50 52 53" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <!-- angry -->
      <g class="elf-mood elf-mood-a">
        <path d="M40 44 L46 46" stroke="#1f6f5a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 44 L50 46" stroke="#1f6f5a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="elf-eye" cx="43" cy="47" rx="1.7" ry="2" fill="#1f6f5a"/>
        <ellipse class="elf-eye" cx="53" cy="47" rx="1.7" ry="2" fill="#1f6f5a"/>
        <path d="M44 53 Q48 51 52 53" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <!-- surprised -->
      <g class="elf-mood elf-mood-u">
        <ellipse class="elf-eye" cx="43" cy="46" rx="2.4" ry="3" fill="#1f6f5a"/>
        <ellipse class="elf-eye" cx="53" cy="46" rx="2.4" ry="3" fill="#1f6f5a"/>
        <ellipse cx="48" cy="53" rx="2" ry="2.2" fill="#7a4a3a"/>
      </g>
      <!-- sleeping -->
      <g class="elf-mood elf-mood-z">
        <path d="M40 46 Q43 48 46 46" fill="none" stroke="#1f6f5a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 46 Q53 48 56 46" fill="none" stroke="#1f6f5a" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="53" rx="2" ry="1.2" fill="#7a4a3a"/>
      </g>
      <!-- bow, flipped horizontally (now on the left) -->
      <g transform="translate(24,58) scale(-1,1)">
        <path d="M0 0 L-16 -12 M0 0 L-16 12" stroke="#8b5a2b" stroke-width="2" fill="none"/>
        <path d="M-16 -12 Q-22 0 -16 12" stroke="#8b5a2b" stroke-width="1.5" fill="none"/>
        <line x1="0" y1="0" x2="-16" y2="0" stroke="#d4a056" stroke-width="1"/>
      </g>
      <circle class="elf-glow" cx="20" cy="24" r="1.6" fill="#7dd3c0"/>
      <circle class="elf-glow" cx="78" cy="30" r="1.2" fill="#7dd3c0" style="animation-delay:.6s"/>
    </g>
  </svg>