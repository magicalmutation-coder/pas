<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .hb-b{transform-box:fill-box;transform-origin:50% 50%;animation:hb-hover 2.6s ease-in-out infinite}
      .hb-m{display:none}
      svg[data-mood="neutral"] .hb-n,svg[data-mood="happy"] .hb-h,svg[data-mood="sad"] .hb-s,svg[data-mood="angry"] .hb-a,svg[data-mood="surprised"] .hb-u,svg[data-mood="sleeping"] .hb-z{display:inline}
      .hb-eye{animation:hb-blink 3.4s infinite}
      .hb-ring{transform-box:fill-box;transform-origin:50% 50%;animation:hb-spin 5s linear infinite}
      @keyframes hb-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes hb-blink{0%,90%,100%{opacity:1}94%{opacity:.25}}
      @keyframes hb-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
    <g class="hb-b">
      <ellipse class="hb-ring" cx="48" cy="52" rx="26" ry="10" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="5 7" opacity=".5"/>
      <ellipse cx="48" cy="52" rx="18" ry="18" fill="#1f2937" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="48" cy="46" rx="14" ry="10" fill="#0f172a"/>
      <path d="M48 34 L48 28" stroke="#334155" stroke-width="2"/><circle cx="48" cy="27" r="2" fill="#22d3ee"/>
      <g class="hb-m hb-n"><circle class="hb-eye" cx="43" cy="46" r="2.6" fill="#22d3ee"/><circle class="hb-eye" cx="53" cy="46" r="2.6" fill="#22d3ee"/><path d="M44 52 h8" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="hb-m hb-h"><path d="M41 47 q2-2.6 4 0" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/><path d="M51 47 q2-2.6 4 0" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/><path d="M44 52 q4 3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="hb-m hb-s"><circle cx="43" cy="47" r="2.2" fill="#60a5fa"/><circle cx="53" cy="47" r="2.2" fill="#60a5fa"/><path d="M44 53 q4-3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="hb-m hb-a"><path d="M40 44 L46 46" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M56 44 L50 46" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="43" cy="47" r="2.2" fill="#ef4444"/><circle cx="53" cy="47" r="2.2" fill="#ef4444"/><path d="M44 53 q4-3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="hb-m hb-u"><circle cx="43" cy="46" r="3.4" fill="#fbbf24"/><circle cx="53" cy="46" r="3.4" fill="#fbbf24"/><ellipse cx="48" cy="53" rx="2.6" ry="2.6" fill="#334155"/></g>
      <g class="hb-m hb-z"><path d="M41 46 h4" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/><path d="M51 46 h4" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/><path d="M44 53 h8" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
    </g>
  </svg>