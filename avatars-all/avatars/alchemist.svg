      <g class="al-m al-n"><circle class="al-eye" cx="43" cy="45" r="1.7" fill="#1c1917"/><circle class="al-eye" cx="53" cy="45" r="1.7" fill="#1c1917"/><path d="M44 52 L52 52" stroke="#7a4a3a" stroke-width="1.3" stroke-linecap="round"/></g>
