<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .al-b{transform-box:fill-box;transform-origin:50% 100%;animation:al-bob 3s ease-in-out infinite}
      .al-m{display:none}
      svg[data-mood="neutral"] .al-n,svg[data-mood="happy"] .al-h,svg[data-mood="sad"] .al-s,svg[data-mood="angry"] .al-a,svg[data-mood="surprised"] .al-u,svg[data-mood="sleeping"] .al-z{display:inline}
      .al-eye{animation:al-blink 4s infinite}
      .al-bub{animation:al-bub 2s ease-in-out infinite}
      @keyframes al-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
      @keyframes al-blink{0%,92%,100%{opacity:1}95%{opacity:.2}}
      @keyframes al-bub{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
    </style>
