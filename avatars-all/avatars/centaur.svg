      <g class="ct-m ct-s"><circle cx="40" cy="41" r="1.6" fill="#1c1917"/><circle cx="48" cy="41" r="1.6" fill="#1c1917"/><path d="M41 47 Q44 44 47 47" fill="none" stroke="#78350f" stroke-width="1.1" stroke-linecap="round"/></g>
