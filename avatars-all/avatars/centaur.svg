      svg[data-mood="neutral"] .ct-n,svg[data-mood="happy"] .ct-h,svg[data-mood="sad"] .ct-s,svg[data-mood="angry"] .ct-a,svg[data-mood="surprised"] .ct-u,svg[data-mood="sleeping"] .ct-z{display:inline}
      .ct-eye{animation:ct-blink 4.6s infinite}
      @keyframes ct-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes ct-blink{0%,94%,100%{opacity:1}97%{opacity:.2}}
    </style>
