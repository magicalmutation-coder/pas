    <path d="M36 38 L30 30 L38 36 Z" fill="#e7b98d"/><path d="M60 38 L66 30 L58 36 Z" fill="#e7b98d"/>
    <path d="M40 48 L44 52 L48 48 L52 52 L56 48" fill="none" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>
    <g class="st-m st-n"><circle class="st-eye" cx="43" cy="44" r="1.7" fill="#1c1917"/><circle class="st-eye" cx="53" cy="44" r="1.7" fill="#1c1917"/><path d="M44 50 Q48 52 52 50" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/></g>
    <g class="st-m st-h" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"><path d="M41 45 q2-2.4 4 0"/><path d="M51 45 q2-2.4 4 0"/><path d="M44 50 Q48 53 52 50" stroke="#78350f"/></g>
    <g class="st-m st-s"><circle cx="43" cy="45" r="1.6" fill="#1c1917"/><circle cx="53" cy="45" r="1.6" fill="#1c1917"/><path d="M44 51 Q48 48 52 51" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/></g>
    <g class="st-m st-a"><path d="M40 42 L46 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M56 42 L50 44" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="43" cy="45" r="1.6" fill="#1c1917"/><circle cx="53" cy="45" r="1.6" fill="#1c1917"/></g>
    <g class="st-m st-u"><circle cx="43" cy="44" r="2.2" fill="#1c1917"/><circle cx="53" cy="44" r="2.2" fill="#1c1917"/><ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#78350f"/></g>
    <g class="st-m st-z"><path d="M40 44 Q43 46 46 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/><path d="M50 44 Q53 46 56 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="48" cy="51" rx="2" ry="1.2" fill="#78350f"/></g>
  </g>
</svg>
