<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
  <style>
    .st-b{transform-box:fill-box;transform-origin:50% 100%;animation:st-bob 3s ease-in-out infinite}
    .st-m{display:none}
    svg[data-mood="neutral"] .st-n,svg[data-mood="happy"] .st-h,svg[data-mood="sad"] .st-s,svg[data-mood="angry"] .st-a,svg[data-mood="surprised"] .st-u,svg[data-mood="sleeping"] .st-z{display:inline}
    .st-eye{animation:st-blink 4s infinite}
    @keyframes st-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
    @keyframes st-blink{0%,92%,100%{opacity:1}95%{opacity:.2}}
  </style>
