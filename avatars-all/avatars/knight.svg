<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Knight</title>
    <style>
      .kn-body{transform-box:fill-box;transform-origin:50% 100%;animation:kn-bob 3.4s ease-in-out infinite}
      .kn-mood{display:none}
      svg[data-mood="neutral"] .kn-mood-n,svg[data-mood="happy"] .kn-mood-h,svg[data-mood="sad"] .kn-mood-s,svg[data-mood="angry"] .kn-mood-a,svg[data-mood="surprised"] .kn-mood-u,svg[data-mood="sleeping"] .kn-mood-z{display:inline}
      .kn-plume{transform-box:fill-box;transform-origin:50% 100%;animation:kn-sway 2.6s ease-in-out infinite}
      @keyframes kn-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes kn-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
      @media(prefers-reduced-motion:reduce){.kn-body,.kn-plume{animation:none}}
    </style>
    <g class="kn-body">
      <path d="M48 56 C34 56 24 64 22 94 h52 C72 64 62 56 48 56Z" fill="#94a3b8"/>
      <rect x="30" y="56" width="36" height="8" rx="2" fill="#64748b"/>
      <path d="M36 64 L48 70 L60 64" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M32 34 C32 22 40 16 48 16 C56 16 64 22 64 34 L64 46 L32 46 Z" fill="#cbd5e1"/>
      <rect x="32" y="44" width="32" height="4" fill="#94a3b8"/>
      <rect x="38" y="36" width="20" height="3" rx="1" fill="#1e293b"/>
      <!-- neutral -->
      <g class="kn-mood kn-mood-n">
        <circle cx="42" cy="40" r="1.2" fill="#38bdf8"/>
        <circle cx="54" cy="40" r="1.2" fill="#38bdf8"/>
      </g>
      <!-- happy -->
      <g class="kn-mood kn-mood-h">
        <path d="M40 39 q2-2 4 0" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M52 39 q2-2 4 0" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M44 46 Q48 48 52 46" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- sad -->
      <g class="kn-mood kn-mood-s">
        <circle cx="42" cy="40" r="1.2" fill="#38bdf8"/>
        <circle cx="54" cy="40" r="1.2" fill="#38bdf8"/>
        <path d="M44 47 Q48 44 52 47" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- angry -->
      <g class="kn-mood kn-mood-a">
        <path d="M39 38 L45 40" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M57 38 L51 40" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <circle cx="42" cy="41" r="1.2" fill="#ef4444"/>
        <circle cx="54" cy="41" r="1.2" fill="#ef4444"/>
        <path d="M44 47 Q48 45 52 47" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- surprised -->
      <g class="kn-mood kn-mood-u">
        <circle cx="42" cy="40" r="1.6" fill="#38bdf8"/>
        <circle cx="54" cy="40" r="1.6" fill="#38bdf8"/>
        <ellipse cx="48" cy="47" rx="2" ry="2.2" fill="#fbbf24"/>
      </g>
      <!-- sleeping -->
      <g class="kn-mood kn-mood-z">
        <path d="M39 40 Q42 42 45 40" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M51 40 Q54 42 57 40" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="47" rx="2" ry="1.2" fill="#fbbf24"/>
      </g>
      <g class="kn-plume" transform="translate(48,16)">
        <path d="M0 0 C-6 -10 -2 -22 4 -26 C2 -18 6 -12 2 -4 Z" fill="#ef4444"/>
        <path d="M0 0 C6 -8 10 -18 6 -24 C8 -16 4 -10 0 -4 Z" fill="#f87171"/>
      </g>
      <g transform="translate(76,48) rotate(-20)">
        <rect x="-2" y="-30" width="4" height="30" fill="#e2e8f0"/>
        <rect x="-7" y="0" width="14" height="3" fill="#78350f"/>
        <circle cx="0" cy="6" r="3" fill="#fbbf24"/>
      </g>
      <g transform="translate(16,60)">
        <path d="M0 0 L14 -4 L14 16 L0 24 L-14 16 L-14 -4 Z" fill="#1e3a8a" stroke="#cbd5e1" stroke-width="1.5"/>
        <path d="M0 -2 L0 20 M-8 8 L8 8" stroke="#fbbf24" stroke-width="2"/>
      </g>
    </g>
  </svg>