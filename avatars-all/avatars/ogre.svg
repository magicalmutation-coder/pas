      svg[data-mood="neutral"] .og-n,svg[data-mood="happy"] .og-h,svg[data-mood="sad"] .og-s,svg[data-mood="angry"] .og-a,svg[data-mood="surprised"] .og-u,svg[data-mood="sleeping"] .og-z{display:inline}
      .og-eye{animation:og-blink 5.2s infinite}
      @keyframes og-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
      @keyframes og-blink{0%,95%,100%{opacity:1}98%{opacity:.2}}
    </style>
