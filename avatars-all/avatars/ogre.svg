      <g class="og-m og-s"><circle cx="40" cy="41" r="2" fill="#1c1917"/><circle cx="56" cy="41" r="2" fill="#1c1917"/><path d="M44 51 q4-2 8 0" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="og-m og-a"><path d="M37 37 L44 40" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M59 37 L52 40" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="40" cy="41" r="2" fill="#1c1917"/><circle cx="56" cy="41" r="2" fill="#1c1917"/><path d="M44 51 q4-2 8 0" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/></g>
