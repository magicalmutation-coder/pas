<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .og-b{transform-box:fill-box;transform-origin:50% 100%;animation:og-bob 3.9s ease-in-out infinite}
