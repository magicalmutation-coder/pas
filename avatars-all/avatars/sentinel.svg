<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .se-b{transform-box:fill-box;transform-origin:50% 100%;animation:se-bob 3.2s ease-in-out infinite}
      .se-m{display:none}
      svg[data-mood="neutral"] .se-n,svg[data-mood="happy"] .se-h,svg[data-mood="sad"] .se-s,svg[data-mood="angry"] .se-a,svg[data-mood="surprised"] .se-u,svg[data-mood="sleeping"] .se-z{display:inline}
      .se-eye{animation:se-scan 2.4s ease-in-out infinite}
      @keyframes se-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes se-scan{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
    <g class="se-b">
