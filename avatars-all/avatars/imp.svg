<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Imp</title>
    <style>
      .im-body{transform-box:fill-box;transform-origin:50% 100%;animation:im-bob 2.2s ease-in-out infinite}
      .im-mood{display:none}
      svg[data-mood="neutral"] .im-mood-n,svg[data-mood="happy"] .im-mood-h,svg[data-mood="sad"] .im-mood-s,svg[data-mood="angry"] .im-mood-a,svg[data-mood="surprised"] .im-mood-u,svg[data-mood="sleeping"] .im-mood-z{display:inline}
      .im-eye{transform-box:fill-box;transform-origin:50% 50%;animation:im-blink 3.2s infinite}
      .im-tail{transform-box:fill-box;transform-origin:0 0;animation:im-wag 1.8s ease-in-out infinite}
      @keyframes im-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
      @keyframes im-blink{0%,86%,100%{transform:scaleY(1)}92%{transform:scaleY(.1)}}
      @keyframes im-wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
      @media(prefers-reduced-motion:reduce){.im-body,.im-eye,.im-tail{animation:none}}
    </style>
    <g class="im-body">
      <!-- tail -->
      <g class="im-tail" transform="translate(62,78)">
        <path d="M0 0 Q12 -6 18 -16 Q20 -20 16 -22" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 -24 L18 -20 L12 -18 Z" fill="#991b1b"/>
      </g>
      <!-- body -->
      <path d="M48 60 C38 60 30 68 28 94 h40 C66 68 58 60 48 60Z" fill="#dc2626"/>
      <ellipse cx="48" cy="46" rx="12" ry="13" fill="#fca5a5"/>
      <!-- horns -->
      <path d="M36 34 L32 20 L40 30 Z" fill="#7f1d1d"/>
      <path d="M60 34 L64 20 L56 30 Z" fill="#7f1d1d"/>
      <!-- ears -->
      <path d="M34 40 L26 34 L34 44 Z" fill="#dc2626"/>
      <path d="M62 40 L70 34 L62 44 Z" fill="#dc2626"/>
      <g class="im-mood im-mood-n">
        <ellipse class="im-eye" cx="43" cy="46" rx="2.2" ry="2.8" fill="#1c1917"/>
        <ellipse class="im-eye" cx="53" cy="46" rx="2.2" ry="2.8" fill="#1c1917"/>
        <circle cx="43.6" cy="45.2" r="0.7" fill="#fff"/>
        <circle cx="53.6" cy="45.2" r="0.7" fill="#fff"/>
        <path d="M44 52 Q48 54 52 52" fill="none" stroke="#7f1d1d" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="im-mood im-mood-h" fill="none" stroke="#7f1d1d" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 47 q2-2.6 4 0"/><path d="M51 47 q2-2.6 4 0"/>
        <path d="M44 52 Q48 56 52 52" stroke="#7a4a3a"/>
      </g>
      <g class="im-mood im-mood-s">
        <ellipse class="im-eye" cx="43" cy="47" rx="2" ry="2.4" fill="#1c1917"/>
        <ellipse class="im-eye" cx="53" cy="47" rx="2" ry="2.4" fill="#1c1917"/>
        <path d="M44 53 Q48 50 52 53" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="im-mood im-mood-a">
        <path d="M40 44 L46 46" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 44 L50 46" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="im-eye" cx="43" cy="47" rx="2" ry="2.4" fill="#1c1917"/>
        <ellipse class="im-eye" cx="53" cy="47" rx="2" ry="2.4" fill="#1c1917"/>
        <path d="M44 53 Q48 51 52 53" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="im-mood im-mood-u">
        <ellipse class="im-eye" cx="43" cy="46" rx="2.8" ry="3.4" fill="#1c1917"/>
        <ellipse class="im-eye" cx="53" cy="46" rx="2.8" ry="3.4" fill="#1c1917"/>
        <ellipse cx="48" cy="53" rx="2.2" ry="2.4" fill="#7a4a3a"/>
      </g>
      <g class="im-mood im-mood-z">
        <path d="M40 46 Q43 48 46 46" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 46 Q53 48 56 46" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="53" rx="2" ry="1.2" fill="#7a4a3a"/>
      </g>
    </g>
  </svg>