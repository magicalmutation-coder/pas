<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Fish</title>
    <style>
      .fs-body{transform-box:fill-box;transform-origin:50% 50%;animation:fs-bob 2.2s ease-in-out infinite}
      .fs-mood{display:none}
      svg[data-mood="neutral"] .fs-mood-n,svg[data-mood="happy"] .fs-mood-h,svg[data-mood="sad"] .fs-mood-s,svg[data-mood="angry"] .fs-mood-a,svg[data-mood="surprised"] .fs-mood-u,svg[data-mood="sleeping"] .fs-mood-z{display:inline}
      .fs-eye{transform-box:fill-box;transform-origin:50% 50%;animation:fs-blink 3.4s infinite}
      .fs-tail{transform-box:fill-box;transform-origin:0 50%;animation:fs-wag 1.6s ease-in-out infinite}
      .fs-bubble{animation:fs-pop 2s ease-in-out infinite}
      @keyframes fs-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes fs-blink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
      @keyframes fs-wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
      @keyframes fs-pop{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
      @media(prefers-reduced-motion:reduce){.fs-body,.fs-eye,.fs-tail,.fs-bubble{animation:none}}
    </style>
    <g class="fs-body">
      <ellipse cx="46" cy="52" rx="26" ry="16" fill="#0ea5e9"/>
      <g class="fs-tail" transform="translate(72,52)">
        <path d="M0 0 L16 -10 L16 10 Z" fill="#0284c7"/>
      </g>
      <!-- fins -->
      <path d="M40 36 L46 28 L52 36" fill="#38bdf8"/>
      <path d="M40 68 L46 76 L52 68" fill="#38bdf8"/>
      <!-- eye -->
      <g class="fs-mood fs-mood-n">
        <ellipse class="fs-eye" cx="34" cy="48" rx="4" ry="5" fill="#fff"/>
        <circle cx="33" cy="48" r="2" fill="#1c1917"/>
        <circle cx="32.4" cy="47.2" r="0.7" fill="#fff"/>
        <path d="M52 56 Q56 58 60 56" fill="none" stroke="#0c4a6e" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="fs-mood fs-mood-h" fill="none" stroke="#0c4a6e" stroke-width="1.6" stroke-linecap="round">
        <path d="M30 49 q2-2.4 4 0"/>
        <path d="M52 56 Q56 60 60 56"/>
      </g>
      <g class="fs-mood fs-mood-s">
        <ellipse class="fs-eye" cx="34" cy="49" rx="3.6" ry="4.4" fill="#fff"/>
        <circle cx="34" cy="50" r="1.8" fill="#1c1917"/>
        <path d="M52 58 Q56 55 60 58" fill="none" stroke="#0c4a6e" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="fs-mood fs-mood-a">
        <path d="M29 46 L35 48" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="fs-eye" cx="34" cy="49" rx="3.6" ry="4.4" fill="#fff"/>
        <circle cx="34" cy="50" r="1.8" fill="#ef4444"/>
        <path d="M52 58 Q56 56 60 58" fill="none" stroke="#0c4a6e" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="fs-mood fs-mood-u">
        <ellipse class="fs-eye" cx="34" cy="48" rx="4.6" ry="5.6" fill="#fff"/>
        <circle cx="33" cy="48" r="2.4" fill="#1c1917"/>
        <ellipse cx="56" cy="58" rx="2.4" ry="2.6" fill="#0c4a6e"/>
      </g>
      <g class="fs-mood fs-mood-z">
        <path d="M30 48 Q34 50 38 48" fill="none" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="56" cy="58" rx="2" ry="1.2" fill="#0c4a6e"/>
      </g>
      <circle class="fs-bubble" cx="20" cy="30" r="2" fill="#7dd3fc"/>
      <circle class="fs-bubble" cx="14" cy="44" r="1.4" fill="#7dd3fc" style="animation-delay:.7s"/>
    </g>
  </svg>