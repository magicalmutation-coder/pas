      .md-eye{animation:md-blink 4.2s infinite}
      @keyframes md-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
      @keyframes md-blink{0%,91%,100%{opacity:1}95%{opacity:.2}}
