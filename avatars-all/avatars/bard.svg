<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Bard</title>
    <style>
      .bd-body{transform-box:fill-box;transform-origin:50% 100%;animation:bd-bob 2.7s ease-in-out infinite}
      .bd-mood{display:none}
      svg[data-mood="neutral"] .bd-mood-n,svg[data-mood="happy"] .bd-mood-h,svg[data-mood="sad"] .bd-mood-s,svg[data-mood="angry"] .bd-mood-a,svg[data-mood="surprised"] .bd-mood-u,svg[data-mood="sleeping"] .bd-mood-z{display:inline}
      .bd-eye{transform-box:fill-box;transform-origin:50% 50%;animation:bd-blink 3.8s infinite}
      .bd-note{animation:bd-float 2.2s ease-in-out infinite}
      @keyframes bd-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes bd-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      @keyframes bd-float{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:1}}
      @media(prefers-reduced-motion:reduce){.bd-body,.bd-eye,.bd-note{animation:none}}
    </style>
    <g class="bd-body">
