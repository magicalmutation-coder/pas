        <ellipse class="bd-eye" cx="53" cy="45" rx="1.6" ry="2" fill="#1e1b4b"/>
        <path d="M44 51 Q48 49 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="bd-mood bd-mood-u">
        <ellipse class="bd-eye" cx="43" cy="44" rx="2.2" ry="2.8" fill="#1e1b4b"/>
        <ellipse class="bd-eye" cx="53" cy="44" rx="2.2" ry="2.8" fill="#1e1b4b"/>
        <ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#7a4a3a"/>
      </g>
      <g class="bd-mood bd-mood-z">
        <path d="M40 44 Q43 46 46 44" fill="none" stroke="#1e1b4b" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 44 Q53 46 56 44" fill="none" stroke="#1e1b4b" stroke-width="1.6" stroke-linecap="round"/>
