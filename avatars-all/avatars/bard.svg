        <ellipse class="bd-eye" cx="53" cy="44" rx="1.7" ry="2.3" fill="#1e1b4b"/>
        <path d="M44 50 Q48 53 52 50" fill="none" stroke="#7a4a3a" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="bd-mood bd-mood-h" fill="none" stroke="#1e1b4b" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 45 q2-2.4 4 0"/><path d="M51 45 q2-2.4 4 0"/>
        <path d="M44 50 Q48 54 52 50" stroke="#7a4a3a"/>
      </g>
      <g class="bd-mood bd-mood-s">
        <ellipse class="bd-eye" cx="43" cy="45" rx="1.6" ry="2" fill="#1e1b4b"/>
        <ellipse class="bd-eye" cx="53" cy="45" rx="1.6" ry="2" fill="#1e1b4b"/>
        <path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="bd-mood bd-mood-a">
        <path d="M40 42 L46 44" stroke="#1e1b4b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 42 L50 44" stroke="#1e1b4b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
