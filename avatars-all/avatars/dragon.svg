<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Dragon</title>
    <style>
      .dg-body{transform-box:fill-box;transform-origin:50% 100%;animation:dg-bob 3s ease-in-out infinite}
      .dg-mood{display:none}
      svg[data-mood="neutral"] .dg-mood-n,svg[data-mood="happy"] .dg-mood-h,svg[data-mood="sad"] .dg-mood-s,svg[data-mood="angry"] .dg-mood-a,svg[data-mood="surprised"] .dg-mood-u,svg[data-mood="sleeping"] .dg-mood-z{display:inline}
      .dg-eye{transform-box:fill-box;transform-origin:50% 50%;animation:dg-blink 4s infinite}
      .dg-wing{transform-box:fill-box;transform-origin:50% 50%;animation:dg-flap 2.6s ease-in-out infinite}
      .dg-fire{animation:dg-fire 1.8s ease-in-out infinite}
      @keyframes dg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes dg-blink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
      @keyframes dg-flap{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
      @keyframes dg-fire{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
      @media(prefers-reduced-motion:reduce){.dg-body,.dg-eye,.dg-wing,.dg-fire{animation:none}}
    </style>
    <g class="dg-body">
      <!-- tail -->
      <path d="M78 78 C86 70 88 58 82 50" fill="none" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round"/>
      <path d="M82 50 L88 44 L80 46 Z" fill="#7f1d1d"/>
      <!-- body -->
      <ellipse cx="48" cy="70" rx="22" ry="16" fill="#dc2626"/>
      <!-- wings -->
      <g class="dg-wing" style="transform-origin:40px 52px">
        <path d="M34 52 L18 30 L26 50 L12 40 L24 58 Z" fill="#991b1b" opacity=".85"/>
      </g>
      <g class="dg-wing" style="transform-origin:56px 52px">
        <path d="M62 52 L78 30 L70 50 L84 40 L72 58 Z" fill="#991b1b" opacity=".85"/>
      </g>
      <!-- neck + head -->
      <path d="M58 60 C62 50 66 44 62 34" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="60" cy="32" rx="13" ry="11" fill="#dc2626"/>
      <!-- horns -->
      <path d="M50 24 L46 12 L52 22 Z" fill="#7f1d1d"/>
      <path d="M70 24 L74 12 L68 22 Z" fill="#7f1d1d"/>
      <!-- snout -->
      <ellipse cx="70" cy="34" rx="7" ry="5" fill="#b91c1c"/>
      <circle cx="72" cy="33" r="1.2" fill="#1c1917"/>
      <circle cx="66" cy="33" r="1.2" fill="#1c1917"/>
      <g class="dg-mood dg-mood-n">
        <ellipse class="dg-eye" cx="54" cy="30" rx="2.4" ry="3" fill="#fbbf24"/>
        <circle cx="54" cy="30" r="1.2" fill="#1c1917"/>
        <path d="M66 38 L74 38" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="dg-mood dg-mood-h">
        <path d="M52 31 q2-2.6 4 0" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M66 38 Q70 41 74 38" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="dg-mood dg-mood-s">
        <ellipse class="dg-eye" cx="54" cy="31" rx="2.2" ry="2.6" fill="#60a5fa"/>
        <path d="M66 40 Q70 37 74 40" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="dg-mood dg-mood-a">
        <path d="M51 28 L57 31" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M63 28 L57 31" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <ellipse class="dg-eye" cx="54" cy="31" rx="2.2" ry="2.6" fill="#ef4444"/>
        <path d="M66 40 Q70 38 74 40" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <g class="dg-mood dg-mood-u">
        <ellipse class="dg-eye" cx="54" cy="30" rx="3" ry="3.6" fill="#fbbf24"/>
        <circle cx="54" cy="30" r="1.4" fill="#1c1917"/>
        <ellipse cx="70" cy="39" rx="2.4" ry="2.6" fill="#1c1917"/>
      </g>
      <g class="dg-mood dg-mood-z">
        <path d="M51 30 Q54 32 57 30" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M66 39 Q70 41 74 39" fill="none" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- fire -->
      <g class="dg-fire" transform="translate(78,34)">
        <path d="M0 0 Q4 -6 2 -12 Q6 -8 4 -2 Q8 -6 6 0 Z" fill="#fbbf24" opacity=".9"/>
        <path d="M1 0 Q3 -4 2 -8 Q4 -5 3 -2 Z" fill="#ef4444"/>
      </g>
      <circle class="dg-glow" cx="48" cy="80" r="0" />
    </g>
  </svg>