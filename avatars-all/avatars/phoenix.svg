<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .px-b{transform-box:fill-box;transform-origin:50% 100%;animation:px-bob 2.6s ease-in-out infinite}
      .px-m{display:none}
      svg[data-mood="neutral"] .px-n,svg[data-mood="happy"] .px-h,svg[data-mood="sad"] .px-s,svg[data-mood="angry"] .px-a,svg[data-mood="surprised"] .px-u,svg[data-mood="sleeping"] .px-z{display:inline}
      .px-eye{animation:px-blink 3.6s infinite}
      .px-flame{animation:px-flame 1.2s ease-in-out infinite}
      @keyframes px-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
      @keyframes px-blink{0%,90%,100%{opacity:1}94%{opacity:.2}}
      @keyframes px-flame{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
    </style>
    <g class="px-b">
      <g class="px-flame" style="transform-origin:48px 70px"><path d="M48 94 Q34 80 40 66 Q46 76 52 62 Q58 76 62 66 Q66 82 48 94 Z" fill="#f59e0b"/></g>
      <path d="M48 62 C38 52 26 44 18 30 C30 34 38 40 44 48 C40 38 42 28 48 22 C52 32 54 42 52 50 C58 42 66 36 78 32 C70 46 58 54 48 62Z" fill="#dc2626"/>
      <path d="M48 60 C42 52 34 46 28 38 C36 41 42 45 46 50 C44 44 45 38 48 34 C51 40 52 46 50 52 C54 47 58 43 66 40 C60 48 54 54 48 60Z" fill="#f97316"/>
      <ellipse cx="48" cy="48" rx="6" ry="6" fill="#fbbf24"/>
      <g class="px-m px-n"><circle class="px-eye" cx="46" cy="47" r="1.4" fill="#7c2d12"/><circle class="px-eye" cx="50" cy="47" r="1.4" fill="#7c2d12"/><path d="M46 51 Q48 52 50 51" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/></g>
      <g class="px-m px-h"><path d="M45 47 q1.5-1.8 3 0" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/><path d="M48 47 q1.5-1.8 3 0" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="48" cy="51" rx="1.4" ry="1" fill="#7c2d12"/></g>
      <g class="px-m px-s"><circle cx="46" cy="48" r="1.2" fill="#7c2d12"/><circle cx="50" cy="48" r="1.2" fill="#7c2d12"/><path d="M46 52 Q48 50 50 52" fill="none" stroke="#7c2d12" stroke-width="1" stroke-linecap="round"/></g>
      <g class="px-m px-a"><path d="M44 45 L47 47" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M52 45 L49 47" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" fill="none"/><circle cx="46" cy="48" r="1.2" fill="#7c2d12"/><circle cx="50" cy="48" r="1.2" fill="#7c2d12"/></g>
      <g class="px-m px-u"><circle cx="46" cy="47" r="1.8" fill="#7c2d12"/><circle cx="50" cy="47" r="1.8" fill="#7c2d12"/><ellipse cx="48" cy="52" rx="1.6" ry="1.6" fill="#7c2d12"/></g>
      <g class="px-m px-z"><path d="M45 48 h3" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/><path d="M49 48 h3" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/></g>
    </g>
  </svg>