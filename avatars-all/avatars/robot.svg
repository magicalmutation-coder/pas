<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Robot</title>
    <style>
      .rb-body{transform-box:fill-box;transform-origin:50% 100%;animation:rb-bob 2.4s ease-in-out infinite}
      .rb-mood{display:none}
      svg[data-mood="neutral"] .rb-mood-n,svg[data-mood="happy"] .rb-mood-h,svg[data-mood="sad"] .rb-mood-s,svg[data-mood="angry"] .rb-mood-a,svg[data-mood="surprised"] .rb-mood-u,svg[data-mood="sleeping"] .rb-mood-z{display:inline}
      .rb-eye{animation:rb-blink 3s steps(1) infinite}
      .rb-ant{animation:rb-wig 1.6s ease-in-out infinite}
      @keyframes rb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes rb-blink{0%,40%,60%,100%{opacity:1}45%,55%{opacity:.2}}
      @keyframes rb-wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
      @media(prefers-reduced-motion:reduce){.rb-body,.rb-eye,.rb-ant{animation:none}}
    </style>
    <g class="rb-body">
      <rect x="30" y="56" width="36" height="34" rx="6" fill="#64748b"/>
      <rect x="34" y="60" width="28" height="6" rx="2" fill="#334155"/>
      <rect x="34" y="68" width="28" height="4" rx="2" fill="#334155"/>
      <rect x="34" y="74" width="28" height="4" rx="2" fill="#334155"/>
      <rect x="32" y="28" width="32" height="30" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <!-- antenna -->
      <g class="rb-ant" style="transform-origin:48px 24px">
        <line x1="48" y1="28" x2="48" y2="18" stroke="#475569" stroke-width="2"/>
        <circle cx="48" cy="16" r="3" fill="#22d3ee"/>
      </g>
      <!-- neutral -->
      <g class="rb-mood rb-mood-n">
        <rect class="rb-eye" x="38" y="36" width="6" height="6" rx="1" fill="#22d3ee"/>
        <rect class="rb-eye" x="52" y="36" width="6" height="6" rx="1" fill="#22d3ee"/>
        <rect x="42" y="48" width="12" height="3" rx="1" fill="#334155"/>
      </g>
      <!-- happy -->
      <g class="rb-mood rb-mood-h">
        <path d="M38 40 L41 37 L44 40" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M52 40 L55 37 L58 40" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M42 49 Q48 53 54 49" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- sad -->
      <g class="rb-mood rb-mood-s">
        <rect class="rb-eye" x="38" y="38" width="6" height="5" rx="1" fill="#60a5fa"/>
        <rect class="rb-eye" x="52" y="38" width="6" height="5" rx="1" fill="#60a5fa"/>
        <path d="M42 50 Q48 47 54 50" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- angry -->
      <g class="rb-mood rb-mood-a">
        <path d="M37 36 L44 39" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M59 36 L52 39" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <rect class="rb-eye" x="38" y="39" width="6" height="5" rx="1" fill="#ef4444"/>
        <rect class="rb-eye" x="52" y="39" width="6" height="5" rx="1" fill="#ef4444"/>
        <path d="M42 50 Q48 48 54 50" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- surprised -->
      <g class="rb-mood rb-mood-u">
        <circle class="rb-eye" cx="41" cy="39" r="4" fill="#fbbf24"/>
        <circle class="rb-eye" cx="55" cy="39" r="4" fill="#fbbf24"/>
        <ellipse cx="48" cy="50" rx="3" ry="3.5" fill="#334155"/>
      </g>
      <!-- sleeping -->
      <g class="rb-mood rb-mood-z">
        <path d="M37 39 L45 39" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M51 39 L59 39" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none"/>
        <ellipse cx="48" cy="50" rx="3" ry="1.5" fill="#334155"/>
      </g>
      <!-- arms -->
      <rect x="22" y="60" width="8" height="22" rx="3" fill="#64748b"/>
      <rect x="66" y="60" width="8" height="22" rx="3" fill="#64748b"/>
    </g>
  </svg>