<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Thief</title>
    <style>
      .th-body{transform-box:fill-box;transform-origin:50% 100%;animation:th-bob 2.8s ease-in-out infinite}
      .th-mood{display:none}
      svg[data-mood="neutral"] .th-mood-n,svg[data-mood="happy"] .th-mood-h,svg[data-mood="sad"] .th-mood-s,svg[data-mood="angry"] .th-mood-a,svg[data-mood="surprised"] .th-mood-u,svg[data-mood="sleeping"] .th-mood-z{display:inline}
      .th-eye{transform-box:fill-box;transform-origin:50% 50%;animation:th-blink 5s infinite}
      .th-coin{animation:th-spin 3s linear infinite}
      @keyframes th-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
      @keyframes th-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
      @keyframes th-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.th-body,.th-eye,.th-coin{animation:none}}
    </style>
    <g class="th-body">
      <path d="M48 58 C36 58 26 66 24 94 h48 C70 66 60 58 48 58Z" fill="#1f2937"/>
      <ellipse cx="48" cy="44" rx="12" ry="13" fill="#f2ddc4"/>
      <path d="M32 44 C32 26 40 20 48 20 C56 20 64 26 64 44 L64 50 L58 46 L48 44 L38 46 L32 50 Z" fill="#111827"/>
      <path d="M40 46 L48 42 L56 46" fill="none" stroke="#374151" stroke-width="1"/>
      <g class="th-mood th-mood-n">
        <ellipse class="th-eye" cx="43" cy="44" rx="1.6" ry="2" fill="#fbbf24"/>
        <ellipse class="th-eye" cx="53" cy="44" rx="1.6" ry="2" fill="#fbbf24"/>
        <path d="M44 50 L52 50" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="th-mood th-mood-h" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round">
        <path d="M41 45 q2-2.2 4 0"/><path d="M51 45 q2-2.2 4 0"/>
        <path d="M44 50 Q48 53 52 50" stroke="#7a4a3a"/>
      </g>
      <g class="th-mood th-mood-s">
        <ellipse class="th-eye" cx="43" cy="45" rx="1.5" ry="1.8" fill="#fbbf24"/>
        <ellipse class="th-eye" cx="53" cy="45" rx="1.5" ry="1.8" fill="#fbbf24"/>
        <path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="th-mood th-mood-a">
        <path d="M40 42 L46 44" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M56 42 L50 44" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <ellipse class="th-eye" cx="43" cy="45" rx="1.5" ry="1.8" fill="#fbbf24"/>
        <ellipse class="th-eye" cx="53" cy="45" rx="1.5" ry="1.8" fill="#fbbf24"/>
        <path d="M44 51 Q48 49 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="th-mood th-mood-u">
        <ellipse class="th-eye" cx="43" cy="44" rx="2.2" ry="2.6" fill="#fbbf24"/>
        <ellipse class="th-eye" cx="53" cy="44" rx="2.2" ry="2.6" fill="#fbbf24"/>
        <ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#7a4a3a"/>
      </g>
      <g class="th-mood th-mood-z">
        <path d="M40 44 Q43 46 46 44" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M50 44 Q53 46 56 44" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="51" rx="2" ry="1.2" fill="#7a4a3a"/>
      </g>
      <g transform="translate(72,56) rotate(15)">
        <rect x="-1.5" y="-26" width="3" height="24" fill="#cbd5e1"/>
        <polygon points="0,-30 -3,-26 3,-26" fill="#e2e8f0"/>
        <rect x="-4" y="-2" width="8" height="3" fill="#78350f"/>
      </g>
      <g transform="translate(20,60) rotate(-20)">
        <rect x="-1.5" y="-22" width="3" height="20" fill="#cbd5e1"/>
        <polygon points="0,-26 -3,-22 3,-22" fill="#e2e8f0"/>
        <rect x="-4" y="-2" width="8" height="3" fill="#78350f"/>
      </g>
      <g class="th-coin" transform="translate(48,78)">
        <circle r="5" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
        <text y="2" text-anchor="middle" font-size="6" fill="#92400e" font-family="monospace">$</text>
      </g>
    </g>
  </svg>