      .sv-eye{animation:sv-blink 3.6s infinite}
      @keyframes sv-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes sv-blink{0%,90%,100%{opacity:1}94%{opacity:.2}}
