<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .sv-b{transform-box:fill-box;transform-origin:50% 100%;animation:sv-bob 2.8s ease-in-out infinite}
