<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" data-mood="neutral">
    <title>Goblin</title>
    <style>
      .gb-body{transform-box:fill-box;transform-origin:50% 100%;animation:gb-bob 2.5s ease-in-out infinite}
      .gb-mood{display:none}
      svg[data-mood="neutral"] .gb-mood-n,svg[data-mood="happy"] .gb-mood-h,svg[data-mood="sad"] .gb-mood-s,svg[data-mood="angry"] .gb-mood-a,svg[data-mood="surprised"] .gb-mood-u,svg[data-mood="sleeping"] .gb-mood-z{display:inline}
      .gb-eye{transform-box:fill-box;transform-origin:50% 50%;animation:gb-blink 3.4s infinite}
      @keyframes gb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes gb-blink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
      @media(prefers-reduced-motion:reduce){.gb-body,.gb-eye{animation:none}}
    </style>
    <g class="gb-body">
      <path d="M48 62 C36 62 28 70 26 94 h44 C68 70 60 62 48 62Z" fill="#4d7c0f"/>
      <ellipse cx="48" cy="46" rx="13" ry="14" fill="#84cc16"/>
      <!-- big ears -->
      <path d="M30 40 L18 32 L28 46 Z" fill="#84cc16"/>
      <path d="M66 40 L78 32 L68 46 Z" fill="#84cc16"/>
      <path d="M22 36 L24 40" stroke="#365314" stroke-width="1" fill="none"/>
      <path d="M74 36 L72 40" stroke="#365314" stroke-width="1" fill="none"/>
      <!-- nose -->
      <path d="M48 48 L46 52 L50 52 Z" fill="#365314"/>
      <g class="gb-mood gb-mood-n">
        <ellipse class="gb-eye" cx="42" cy="44" rx="2.6" ry="3" fill="#1c1917"/>
        <ellipse class="gb-eye" cx="54" cy="44" rx="2.6" ry="3" fill="#1c1917"/>
        <circle cx="42.6" cy="43" r="0.8" fill="#fff"/>
        <circle cx="54.6" cy="43" r="0.8" fill="#fff"/>
        <path d="M43 54 Q48 56 53 54" fill="none" stroke="#1c1917" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <g class="gb-mood gb-mood-h" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round">
        <path d="M40 45 q2-2.6 4 0"/><path d="M52 45 q2-2.6 4 0"/>
        <path d="M43 54 Q48 58 53 54" stroke="#365314"/>
      </g>
      <g class="gb-mood gb-mood-s">
        <ellipse class="gb-eye" cx="42" cy="45" rx="2.4" ry="2.6" fill="#1c1917"/>
        <ellipse class="gb-eye" cx="54" cy="45" rx="2.4" ry="2.6" fill="#1c1917"/>
        <path d="M43 55 Q48 52 53 55" fill="none" stroke="#365314" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="gb-mood gb-mood-a">
        <path d="M39 42 L45 44" stroke="#1c1917" stroke-width="1.7" stroke-linecap="round" fill="none"/>
        <path d="M57 42 L51 44" stroke="#1c1917" stroke-width="1.7" stroke-linecap="round" fill="none"/>
        <ellipse class="gb-eye" cx="42" cy="45" rx="2.4" ry="2.6" fill="#1c1917"/>
        <ellipse class="gb-eye" cx="54" cy="45" rx="2.4" ry="2.6" fill="#1c1917"/>
        <path d="M43 55 Q48 53 53 55" fill="none" stroke="#365314" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <g class="gb-mood gb-mood-u">
        <ellipse class="gb-eye" cx="42" cy="44" rx="3" ry="3.6" fill="#1c1917"/>
        <ellipse class="gb-eye" cx="54" cy="44" rx="3" ry="3.6" fill="#1c1917"/>
        <ellipse cx="48" cy="55" rx="2.4" ry="2.6" fill="#365314"/>
      </g>
      <g class="gb-mood gb-mood-z">
        <path d="M39 44 Q42 46 45 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M51 44 Q54 46 57 44" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="48" cy="55" rx="2" ry="1.2" fill="#365314"/>
      </g>
      <!-- spear -->
      <g transform="translate(78,50) rotate(-20)">
        <rect x="-1.5" y="-30" width="3" height="40" fill="#8b5a2b"/>
        <polygon points="0,-34 -4,-30 4,-30" fill="#cbd5e1"/>
      </g>
    </g>
  </svg>