      .pt-eye{animation:pt-blink 4.4s infinite}
      @keyframes pt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
      @keyframes pt-blink{0%,92%,100%{opacity:1}95%{opacity:.2}}
    </style>
