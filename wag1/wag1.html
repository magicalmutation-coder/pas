<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Guard - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  body{padding:14px 16px 24px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
  .pill{font:11px var(--mono);padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.good{color:#86efac;border-color:rgba(134,239,172,.45);background:rgba(134,239,172,.08)}
  .pill.bad{color:#fca5a5;border-color:rgba(252,165,165,.45);background:rgba(252,165,165,.08)}
  .pill.warn{color:#fde68a;border-color:rgba(253,230,138,.45);background:rgba(253,230,138,.08)}
  .bar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #updated{font-size:11px;color:var(--dim2)}
  button{font:600 12px var(--sans);padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#131a2e;color:var(--txt);cursor:pointer}
  button:hover{border-color:var(--cyan);color:var(--cyan)}
  button.on{border-color:var(--cyan);color:#a5f3fc;background:rgba(34,211,238,.12)}
  #alert{display:none;margin:0 0 12px;padding:9px 12px;border-radius:9px;border:1px solid rgba(248,113,113,.5);background:rgba(248,113,113,.1);color:#fecaca;font-size:12.5px}
  #alert b{color:#fecaca}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .n{font:600 22px var(--sans);color:var(--cyan);line-height:1.15}
  .stat .l{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
  .card.wide{grid-column:1 / -1}
  .card h2{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:2px 0 9px}
  .row{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft,var(--line));min-width:0}
  .row:last-child{border-bottom:0}
  .row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
  .row .r{margin-left:auto;color:var(--dim2);font-size:11.5px;white-space:nowrap}
  .muted{color:var(--dim2);font-size:11.5px}
  .err{color:#fca5a5}
  .good{color:var(--green)}
  .b{font-weight:600}
  #watchList{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .chip{display:inline-flex;gap:5px;align-items:center;font:11.5px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.08);color:#a5f3fc}
  .chip b{font-weight:600}
  .chip button{border:0;background:none;padding:0 0 0 2px;color:#a5f3fc;font-size:13px;line-height:1;cursor:pointer}
  #feed{max-height:340px;overflow:auto}
  .feedline{padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:7px;align-items:baseline}
  .feedline .who{font-weight:600;white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
  .feedline .tx{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
  .feedline .at{color:var(--dim2);font-size:11px;white-space:nowrap}
  .dir{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
  .dir.in{color:var(--green)}
  input{background:#0b1020;border:1px solid var(--line);border-radius:7px;color:var(--txt);font:12px var(--sans);padding:5px 8px;outline:none}
  input:focus{border-color:var(--cyan)}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="alert"></div>

<header>
  <h1>WhatsApp Guard</h1>
  <span id="conn" class="pill">checking…</span>
  <span id="acct" class="muted"></span>
  <span class="bar">
    <span id="updated"></span>
    <button id="pause">pause</button>
    <button id="refresh">refresh</button>
  </span>
</header>

<div class="stats">
  <div class="stat"><div class="n" id="sUnreadChats">–</div><div class="l">unread chats</div></div>
  <div class="stat"><div class="n" id="sUnreadMsgs">–</div><div class="l">unread messages</div></div>
  <div class="stat"><div class="n" id="sAuto">–</div><div class="l">auto-sent 24h</div></div>
  <div class="stat"><div class="n" id="sDrafts">–</div><div class="l">drafts waiting</div></div>
</div>

<div class="grid">
  <section class="card wide" id="c-watch">
    <h2>Watchlist <span class="muted">- any unread chat whose name or number contains one of these raises the banner</span></h2>
    <div id="watchList"></div>
    <div class="row">
      <input id="watchAdd" placeholder="add a name or number, then Enter" style="flex:1 1 auto;min-width:200px">
      <button id="watchBtn">watch</button>
    </div>
  </section>

  <section class="card" id="c-attention">
    <h2>Needs attention</h2>
    <div id="attention" class="muted">loading…</div>
  </section>

  <section class="card" id="c-recent">
    <h2>Chats</h2>
    <div id="chats" class="muted">loading…</div>
  </section>

  <section class="card wide" id="c-feed">
    <h2>Live feed <span class="muted">- the newest messages across the busiest chats</span></h2>
    <div id="feed" class="muted">loading…</div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WATCH_KEY = 'wag1_watch';
let WATCH = [];
try { WATCH = JSON.parse(localStorage.getItem(WATCH_KEY) || '[]').filter(x => typeof x === 'string'); } catch (e) { WATCH = []; }
let PAUSED = false, TIMER = 0, MSGCHATS = 8, LASTLOAD = 0;

async function j(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const t = await r.json().catch(() => null);
    if (!r.ok) return { ok: false, error: (t && (t.error || t.detail)) || ('HTTP ' + r.status) };
    return t || { ok: false, error: 'no answer' };
  } catch (e) { return { ok: false, error: String(e) }; }
}
const when = ts => {
  if (!ts) return '';
  const d = new Date(ts * 1000), now = Date.now(), s = Math.round((now - d.getTime()) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.round(s / 60) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  if (s < 7 * 86400) return Math.round(s / 86400) + 'd';
  return d.toLocaleDateString();
};
const watchHit = c => {
  const hay = ((c.name || '') + ' ' + (c.id || '')).toLowerCase();
  return WATCH.filter(w => w && hay.includes(String(w).toLowerCase()));
};

function paintWatch() {
  $('watchList').innerHTML = WATCH.length
    ? WATCH.map((w, i) => '<span class="chip"><b>' + esc(w) + '</b><button data-i="' + i + '" title="stop watching">&times;</button></span>').join('')
    : '<span class="muted">nothing watched yet</span>';
  $('watchList').querySelectorAll('[data-i]').forEach(b => {
    b.onclick = () => { WATCH.splice(Number(b.dataset.i), 1); saveWatch(); };
  });
}
function saveWatch() {
  localStorage.setItem(WATCH_KEY, JSON.stringify(WATCH));
  paintWatch();
  if (LASTLOAD) paint(LASTLOAD);
}
function addWatch() {
  const v = ($('watchAdd').value || '').trim();
  if (!v) return;
  if (!WATCH.some(w => w.toLowerCase() === v.toLowerCase())) WATCH.push(v);
  $('watchAdd').value = '';
  saveWatch();
}

function paint(d) {
  const status = d.status || {}, chats = (d.chats && d.chats.chats) || [];
  const auto = (d.auto && d.auto.ok) ? d.auto : {};

  const conn = $('conn');
  const state = String(status.state || (status.ok ? 'unknown' : 'unreachable'));
  conn.textContent = state;
  conn.className = 'pill ' + (state === 'ready' || state === 'connected' ? 'good' : (status.running ? 'warn' : 'bad'));
  $('acct').textContent = status.me ? ('as ' + status.me) : (status.ok ? '' : (status.error || ''));

  const unreadChats = chats.filter(c => Number(c.unread) > 0);
  const unreadMsgs = chats.reduce((n, c) => n + (Number(c.unread) || 0), 0);
  $('sUnreadChats').textContent = String(unreadChats.length);
  $('sUnreadMsgs').textContent = String(unreadMsgs);
  const s = auto.summary || {};
  $('sAuto').textContent = (s.auto_sent24 == null ? '–' : String(s.auto_sent24));
  $('sDrafts').textContent = (s.pending == null ? '–' : String(s.pending));

  const hits = unreadChats.filter(c => watchHit(c).length);
  const al = $('alert');
  if (hits.length) {
    al.style.display = 'block';
    al.innerHTML = '<b>Watchlist:</b> ' + hits.map(c => esc(c.name || c.id) + ' (' + Number(c.unread) + ' unread)').join(' · ');
  } else {
    al.style.display = 'none';
    al.innerHTML = '';
  }

  $('attention').innerHTML = unreadChats.length
    ? unreadChats.slice().sort((a, b) => Number(b.unread) - Number(a.unread)).slice(0, 12).map(c =>
        '<div class="row"><span class="nm">' + (watchHit(c).length ? '★ ' : '') + esc(c.name || c.id) + '</span>' +
        '<span class="r">' + Number(c.unread) + ' unread · ' + esc(when(c.ts)) + '</span></div>').join('')
    : '<div class="muted">nothing unread - this is the quiet state</div>';

  $('chats').innerHTML = chats.length
    ? chats.slice(0, 12).map(c =>
        '<div class="row"><span class="nm">' + esc(c.name || c.id) + '</span>' +
        '<span class="r">' + esc(String(c.last || '').slice(0, 34)) + (c.ts ? ' · ' + esc(when(c.ts)) : '') + '</span></div>').join('')
    : '<div class="muted">no conversations in the bridge database yet</div>';

  const merged = [];
  for (const c of (d.feeds || [])) {
    for (const m of (c.messages || [])) {
      merged.push({ chat: c.chat, name: c.name, m });
    }
  }
  merged.sort((a, b) => Number(b.m.ts) - Number(a.m.ts));
  $('feed').innerHTML = merged.length
    ? merged.slice(0, 40).map(x =>
        '<div class="feedline"><span class="dir ' + (x.m.from_me ? '' : 'in') + '">' + (x.m.from_me ? 'out' : 'in') + '</span>' +
        '<span class="who">' + esc(x.m.from_me ? 'me' : (x.name || x.chat)) + '</span>' +
        '<span class="tx">' + (x.m.mention_me ? '<span class="b">@you </span>' : '') + esc(String(x.m.text || (x.m.media ? '[media]' : '')).slice(0, 120)) + '</span>' +
        '<span class="at">' + esc(when(x.m.ts)) + '</span></div>').join('')
    : '<div class="muted">no messages to show</div>';

  $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
}

async function load() {
  const status = await j('/api/modules/whatsapp/status');
  const chats = await j('/api/modules/whatsapp/chats');
  const auto = await j('/api/modules/whatsapp/auto-contacts');

  if (!chats.ok) {
    $('conn').textContent = 'unreachable';
    $('conn').className = 'pill bad';
    $('acct').textContent = chats.error || status.error || '';
    $('attention').innerHTML = '<div class="err">' + esc(chats.error || 'the WhatsApp bridge did not answer') + '</div>';
    $('chats').innerHTML = '<div class="err">' + esc(chats.error || '') + '</div>';
    $('feed').innerHTML = '<div class="err">nothing to read until the bridge answers</div>';
    return;
  }

  const list = (chats.chats || []).slice(0, MSGCHATS);
  const feeds = await Promise.all(list.map(async c => {
    const r = await j('/api/modules/whatsapp/messages?chat=' + encodeURIComponent(c.id) + '&limit=15');
    return { chat: c.id, name: c.name || c.id, messages: (r && r.ok && r.messages) || [] };
  }));

  LASTLOAD = { status, chats, auto, feeds };
  paint(LASTLOAD);
}

function tick() {
  if (PAUSED || document.hidden) return;
  load();
}

$('refresh').onclick = () => load();
$('pause').onclick = () => {
  PAUSED = !PAUSED;
  $('pause').textContent = PAUSED ? 'resume' : 'pause';
  $('pause').className = PAUSED ? 'on' : '';
  if (!PAUSED) load();
};
$('watchBtn').onclick = addWatch;
$('watchAdd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addWatch(); } });

paintWatch();
load();
TIMER = setInterval(tick, 15000);
</script>
</body>
</html>
