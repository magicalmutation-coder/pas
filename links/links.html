<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
/* colour tokens come from /assets/theme.css; only what differs stays here */
:root{--panel:#0c121b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--mono)}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0 10px 0 0;color:var(--dim)}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:12px var(--mono);padding:6px 8px}
button{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4);color:#c9f7ff;border-radius:8px;font:12px var(--mono);padding:6px 10px;cursor:pointer}
button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
button.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4);color:#fecaca}
button:disabled{opacity:.45;cursor:default}
#status{color:var(--dim2);font-size:11px;margin-left:auto}
.good{color:var(--green)} .bad{color:var(--red)}
main{padding:12px;display:flex;flex-direction:column;gap:14px}
section.cat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px}
section.cat h2{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:2px 4px 8px;display:flex;align-items:center;gap:8px}
section.cat h2 button{font-size:10px;padding:2px 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:9px;background:#0a0f18;padding:9px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .top{display:flex;align-items:center;gap:6px}
.tile b{font-size:12.5px;color:#dbe7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--dim)}
.kind.web{color:#7dd3fc;border-color:rgba(125,211,252,.35)}
.kind.telnet{color:#fbbf24;border-color:rgba(251,191,36,.35)}
.kind.ssh{color:#a78bfa;border-color:rgba(167,139,250,.35)}
.kind.app,.kind.script{color:#34d399;border-color:rgba(52,211,153,.35)}
.target{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{font-size:11px;padding:4px 8px}
.sshbox{display:flex;gap:4px}
.sshbox input{flex:1 1 auto;min-width:0;font-size:11px;padding:4px 6px}
pre.out{margin:0;background:#05080d;border:1px solid var(--line);border-radius:7px;padding:7px;font:11px/1.4 var(--mono);color:#cfe0f7;white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;display:none}
#editor{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px}
#editor h2{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:2px 4px 8px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.hint{color:var(--dim2);font-size:11px}
.empty{color:var(--dim2);font-size:12px;padding:4px}
</style>
</head>
<body>
<header>
  <h1>Links</h1>
  <button id="refresh" class="ghost" title="reload from links.json">refresh</button>
  <button id="new" title="clear the form and add a new link">+ add link</button>
  <span class="hint">programs, pages, and places to connect</span>
  <span id="status"></span>
</header>

<main>
  <div id="cats"></div>

  <div id="editor">
    <h2 id="edTitle">add a link</h2>
    <div class="frow">
      <div class="field"><label>name</label><input id="fName" placeholder="Notepad" spellcheck="false" style="width:180px"></div>
      <div class="field"><label>kind</label>
        <select id="fKind">
          <option value="app">app</option>
          <option value="script">script</option>
          <option value="web">web</option>
          <option value="telnet">telnet</option>
          <option value="ssh">ssh</option>
        </select>
      </div>
      <div class="field"><label>category</label>
        <select id="fCat"></select>
      </div>
      <div class="field"><label>new category</label><input id="fNewCat" placeholder="optional" spellcheck="false" style="width:120px"></div>
    </div>

    <div class="frow" id="rowProgram" style="margin-top:8px">
      <div class="field"><label>path</label><input id="fPath" placeholder="notepad, or C:\tools\run.ps1" spellcheck="false" style="width:340px"></div>
      <div class="field"><label>arguments</label><input id="fArgs" placeholder="optional" spellcheck="false" style="width:180px"></div>
      <div class="field"><label>working directory</label><input id="fCwd" placeholder="optional" spellcheck="false" style="width:220px"></div>
    </div>

    <div class="frow" id="rowWeb" style="margin-top:8px;display:none">
      <div class="field"><label>url</label><input id="fUrl" placeholder="https://example.com" spellcheck="false" style="width:420px"></div>
    </div>

    <div class="frow" id="rowConnect" style="margin-top:8px;display:none">
      <div class="field"><label>host</label><input id="fHost" placeholder="games.world.co.uk" spellcheck="false" style="width:240px"></div>
      <div class="field"><label>port</label><input id="fPort" placeholder="23 / 22" spellcheck="false" style="width:90px"></div>
      <div class="field" id="rowUser" style="display:none"><label>user</label><input id="fUser" placeholder="optional" spellcheck="false" style="width:150px"></div>
    </div>

    <div class="frow" style="margin-top:10px">
      <button id="save">save link</button>
      <button id="cancel" class="ghost">cancel edit</button>
      <span id="edHint" class="hint"></span>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let DOC = { categories: [], items: [] };
let EDIT = "";              // id being edited, '' for a new link

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function status(text, cls) {
  const el = $("status");
  el.textContent = text || "";
  el.className = cls || "";
}

async function api(path, body) {
  const opt = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { cache: "no-store" };
  try {
    return await fetch("/api/modules/links/" + path, opt).then(r => r.json());
  } catch (e) {
    return { ok: false, error: "could not reach the server" };
  }
}

function portOf(item) {
  let p = parseInt(item.port, 10);
  if (!p || p < 1 || p > 65535) p = item.kind === "ssh" ? 22 : 23;
  return p;
}

function targetOf(item) {
  if (item.kind === "web") return item.url || item.path || "";
  if (item.kind === "telnet") return (item.host || "") + ":" + portOf(item);
  if (item.kind === "ssh") return (item.user ? item.user + "@" : "") + (item.host || "") + ":" + portOf(item);
  return (item.path || "") + (item.args ? " " + item.args : "");
}

function tile(item) {
  const kind = item.kind || "app";
  const id = esc(item.id);
  const runLabel = kind === "web" ? "open" : (kind === "telnet" ? "connect" : (kind === "ssh" ? "run" : "run"));
  let action = "";
  if (kind === "ssh") {
    action = '<div class="sshbox"><input id="cmd-' + id + '" placeholder="command, e.g. uptime" spellcheck="false">' +
      '<button data-act="ssh" data-id="' + id + '">run</button></div>';
  } else {
    action = '<button data-act="' + (kind === "app" || kind === "script" ? "launch" : "open") + '" data-id="' + id + '">' + runLabel + "</button>";
  }
  return '<div class="tile" data-id="' + id + '">' +
    '<div class="top"><span class="kind ' + esc(kind) + '">' + esc(kind) + "</span><b>" + esc(item.name) + "</b></div>" +
    '<div class="target" title="' + esc(targetOf(item)) + '">' + esc(targetOf(item)) + "</div>" +
    '<div class="actions">' + action +
      '<button class="ghost" data-act="edit" data-id="' + id + '">edit</button>' +
      '<button class="danger" data-act="delete" data-id="' + id + '">delete</button>' +
    "</div>" +
    '<pre class="out" id="out-' + id + '"></pre>' +
  "</div>";
}

function render() {
  const cats = DOC.categories && DOC.categories.length ? DOC.categories : ["apps"];
  const items = DOC.items || [];
  let html = "";
  for (const cat of cats) {
    const mine = items.filter(i => (i.category || "apps") === cat);
    html += '<section class="cat"><h2>' + esc(cat) + ' <span class="hint">' + mine.length + "</span>" +
      (cats.length > 1 ? '<button class="ghost" data-act="delcat" data-cat="' + esc(cat) + '">remove category</button>' : "") +
      "</h2>";
    if (!mine.length) html += '<div class="empty">nothing here yet</div>';
    else html += '<div class="tiles">' + mine.map(tile).join("") + "</div>";
    html += "</section>";
  }
  $("cats").innerHTML = html;

  const sel = $("fCat");
  const keep = sel.value;
  sel.innerHTML = cats.map(c => '<option value="' + esc(c) + '">' + esc(c) + "</option>").join("");
  if (keep && cats.includes(keep)) sel.value = keep;

  $("edHint").textContent = EDIT ? "editing an existing link" : "a new link";
}

function showFields() {
  const kind = $("fKind").value;
  const prog = kind === "app" || kind === "script";
  $("rowProgram").style.display = prog ? "flex" : "none";
  $("rowWeb").style.display = kind === "web" ? "flex" : "none";
  $("rowConnect").style.display = (kind === "telnet" || kind === "ssh") ? "flex" : "none";
  $("rowUser").style.display = kind === "ssh" ? "flex" : "none";
  $("fPort").placeholder = kind === "ssh" ? "22" : "23";
}

function clearForm() {
  EDIT = "";
  $("edTitle").textContent = "add a link";
  $("fName").value = ""; $("fPath").value = ""; $("fArgs").value = ""; $("fCwd").value = "";
  $("fUrl").value = ""; $("fHost").value = ""; $("fPort").value = ""; $("fUser").value = "";
  $("fNewCat").value = "";
  $("fKind").value = "app";
  showFields();
  render();
}

function editItem(item) {
  EDIT = item.id;
  $("edTitle").textContent = "edit: " + item.name;
  $("fKind").value = item.kind || "app";
  $("fName").value = item.name || "";
  $("fPath").value = item.path || "";
  $("fArgs").value = item.args || "";
  $("fCwd").value = item.cwd || "";
  $("fUrl").value = item.url || "";
  $("fHost").value = item.host || "";
  $("fPort").value = item.port ? String(item.port) : "";
  $("fUser").value = item.user || "";
  $("fCat").value = item.category || "apps";
  $("fNewCat").value = "";
  showFields();
  render();
  $("editor").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function load() {
  const r = await api("list");
  if (!r || !r.ok) { status((r && r.error) || "could not load links", "bad"); return; }
  DOC = { categories: r.categories || [], items: r.items || [] };
  render();
  status(DOC.items.length + " link(s)");
}

async function saveLink() {
  const body = {
    id: EDIT,
    name: $("fName").value.trim(),
    kind: $("fKind").value,
    category: ($("fNewCat").value.trim() || $("fCat").value || "apps"),
    path: $("fPath").value.trim(),
    args: $("fArgs").value,
    cwd: $("fCwd").value.trim(),
    url: $("fUrl").value.trim(),
    host: $("fHost").value.trim(),
    port: parseInt($("fPort").value, 10) || 0,
    user: $("fUser").value.trim()
  };
  const r = await api("save", body);
  if (!r || !r.ok) { status((r && r.error) || "save failed", "bad"); return; }
  DOC = { categories: r.categories || [], items: r.items || [] };
  const wasEdit = !!EDIT;
  clearForm();
  status(wasEdit ? "saved" : "added", "good");
}

async function launch(item) {
  if (item.kind === "web") {
    const url = item.url || item.path;
    if (!url) { status("that link has no url", "bad"); return; }
    window.open(url, "_blank", "noopener");
    return;
  }
  const r = await api("launch", { id: item.id });
  if (r && r.ok) status("launched " + (r.name || item.name) + (r.pid ? " (pid " + r.pid + ")" : ""), "good");
  else status((r && r.error) || "could not launch", "bad");
}

async function connectTelnet(item) {
  status("connecting to " + targetOf(item) + "...");
  let r = null;
  try {
    r = await fetch("/api/modules/terminal/open", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: item.host, port: portOf(item) })
    }).then(x => x.json());
  } catch (e) {}
  if (!r || !r.ok) { status((r && r.error) || "could not connect - is the Terminal module on?", "bad"); return; }
  status("connected; opening the terminal", "good");
  window.open("/terminal", "poweragent-terminal", "width=1280,height=900,resizable=yes");
}

async function runSsh(item) {
  const id = item.id;
  const box = $("cmd-" + id);
  const pre = $("out-" + id);
  const command = box ? box.value.trim() : "";
  if (!command) { status("type a command first", "bad"); return; }
  pre.style.display = "block";
  pre.textContent = "running: " + command + " ...";
  let r = null;
  try {
    r = await fetch("/api/modules/terminal/ssh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: item.host, port: portOf(item), user: item.user || "", command: command })
    }).then(x => x.json());
  } catch (e) {}
  if (!r) { pre.textContent = "no answer from the server"; return; }
  if (r.ok) { pre.textContent = r.text || "(no output)"; status("done", "good"); }
  else { pre.textContent = r.error || "ssh failed"; status("ssh failed", "bad"); }
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "delcat") {
    if (!confirm("remove category '" + b.dataset.cat + "'? its links move to apps.")) return;
    const r = await api("category/delete", { name: b.dataset.cat });
    if (r && r.ok) { DOC = { categories: r.categories || [], items: r.items || [] }; render(); }
    return;
  }
  const item = (DOC.items || []).find(i => i.id === b.dataset.id);
  if (!item) return;
  if (act === "edit") { editItem(item); return; }
  if (act === "delete") {
    if (!confirm("delete '" + item.name + "'?")) return;
    const r = await api("delete", { id: item.id });
    if (r && r.ok) { DOC = { categories: r.categories || [], items: r.items || [] }; render(); status("deleted", "good"); }
    return;
  }
  if (act === "launch") { launch(item); return; }
  if (act === "open") {
    if (item.kind === "telnet") { connectTelnet(item); return; }
    launch(item);
    return;
  }
  if (act === "ssh") { runSsh(item); return; }
});

$("fKind").addEventListener("change", showFields);
$("save").addEventListener("click", saveLink);
$("cancel").addEventListener("click", clearForm);
$("refresh").addEventListener("click", load);
$("new").addEventListener("click", clearForm);
$("fName").addEventListener("keydown", e => { if (e.key === "Enter") saveLink(); });

showFields();
load();
</script>
</body>
</html>
