      .ds-eye{animation:ds-blink 4s infinite}
      .ds-bar{animation:ds-grow 3s ease-in-out infinite}
      @keyframes ds-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
      @keyframes ds-blink{0%,92%,100%{opacity:1}95%{opacity:.2}}
      @keyframes ds-grow{0%,100%{opacity:.7}50%{opacity:1}}
