<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .gl-b{transform-box:fill-box;transform-origin:50% 100%;animation:gl-bob 3.8s ease-in-out infinite}
      .gl-m{display:none}
      svg[data-mood="neutral"] .gl-n,svg[data-mood="happy"] .gl-h,svg[data-mood="sad"] .gl-s,svg[data-mood="angry"] .gl-a,svg[data-mood="surprised"] .gl-u,svg[data-mood="sleeping"] .gl-z{display:inline}
      .gl-eye{animation:gl-pulse 2.2s ease-in-out infinite}
      @keyframes gl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes gl-pulse{0%,100%{opacity:.6}50%{opacity:1}}
    </style>
    <g class="gl-b">
