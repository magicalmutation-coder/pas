      <path d="M32 30 h8 M40 44 h10 M52 32 h10" stroke="#a8a29e" stroke-width="1" opacity=".7"/>
      <g class="gl-m gl-n"><circle class="gl-eye" cx="42" cy="40" r="2.4" fill="#22d3ee"/><circle class="gl-eye" cx="54" cy="40" r="2.4" fill="#22d3ee"/><path d="M43 49 h10" stroke="#44403c" stroke-width="2" stroke-linecap="round"/></g>
      <g class="gl-m gl-h"><path d="M40 41 q2-2.6 4 0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/><path d="M52 41 q2-2.6 4 0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/><path d="M43 49 q5 4 10 0" fill="none" stroke="#44403c" stroke-width="2" stroke-linecap="round"/></g>
      <g class="gl-m gl-s"><circle cx="42" cy="41" r="2.2" fill="#60a5fa"/><circle cx="54" cy="41" r="2.2" fill="#60a5fa"/><path d="M43 50 q5-3 10 0" fill="none" stroke="#44403c" stroke-width="2" stroke-linecap="round"/></g>
      <g class="gl-m gl-a"><path d="M38 37 L45 40" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M58 37 L51 40" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="42" cy="41" r="2.2" fill="#ef4444"/><circle cx="54" cy="41" r="2.2" fill="#ef4444"/><path d="M43 50 q5-3 10 0" fill="none" stroke="#44403c" stroke-width="2" stroke-linecap="round"/></g>
      <g class="gl-m gl-u"><circle cx="42" cy="40" r="3" fill="#fbbf24"/><circle cx="54" cy="40" r="3" fill="#fbbf24"/><ellipse cx="48" cy="50" rx="2.6" ry="2.8" fill="#44403c"/></g>
      <g class="gl-m gl-z"><rect x="38" y="40" width="7" height="2" fill="#22d3ee"/><rect x="50" y="40" width="7" height="2" fill="#22d3ee"/><rect x="43" y="50" width="10" height="2" fill="#44403c"/></g>
    </g>
  </svg>