<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .dr-b{transform-box:fill-box;transform-origin:50% 50%;animation:dr-hover 2.4s ease-in-out infinite}
      .dr-m{display:none}
      svg[data-mood="neutral"] .dr-n,svg[data-mood="happy"] .dr-h,svg[data-mood="sad"] .dr-s,svg[data-mood="angry"] .dr-a,svg[data-mood="surprised"] .dr-u,svg[data-mood="sleeping"] .dr-z{display:inline}
      .dr-eye{animation:dr-blink 3.2s infinite}
      .dr-prop{transform-box:fill-box;transform-origin:50% 50%;animation:dr-spin 0.4s linear infinite}
      @keyframes dr-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes dr-blink{0%,88%,100%{opacity:1}94%{opacity:.2}}
      @keyframes dr-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
    <g class="dr-b">
      <line x1="30" y1="32" x2="66" y2="32" stroke="#334155" stroke-width="3"/>
      <line x1="48" y1="32" x2="48" y2="50" stroke="#334155" stroke-width="3"/>
      <g class="dr-prop" style="transform-origin:30px 32px"><ellipse cx="30" cy="32" rx="9" ry="2.4" fill="#22d3ee" opacity=".7"/></g>
      <g class="dr-prop" style="transform-origin:66px 32px"><ellipse cx="66" cy="32" rx="9" ry="2.4" fill="#22d3ee" opacity=".7"/></g>
      <ellipse cx="48" cy="58" rx="18" ry="12" fill="#1f2937" stroke="#334155" stroke-width="1.5"/>
      <circle cx="48" cy="58" r="7" fill="#0b0f16"/>
      <g class="dr-m dr-n"><circle class="dr-eye" cx="48" cy="58" r="3.2" fill="#22d3ee"/><circle cx="49" cy="57" r="1" fill="#fff"/><rect x="42" y="66" width="12" height="2" rx="1" fill="#334155"/></g>
      <g class="dr-m dr-h"><path d="M43 60 q3-3 6 0" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/><path d="M44 66 q4 3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="dr-m dr-s"><circle cx="48" cy="59" r="3" fill="#60a5fa"/><path d="M44 67 q4-3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="dr-m dr-a"><path d="M42 55 L48 58" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M54 55 L48 58" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="48" cy="59" r="2.6" fill="#ef4444"/></g>
      <g class="dr-m dr-u"><circle cx="48" cy="58" r="4.4" fill="#fbbf24"/><circle cx="48" cy="58" r="1.6" fill="#0b0f16"/></g>
      <g class="dr-m dr-z"><path d="M43 58 h10" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/><path d="M44 66 h8" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
    </g>
  </svg>