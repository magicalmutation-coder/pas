      <path d="M52 31 C62 33 64 40 62 50 L56 48 L54 38 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
      <rect x="38" y="40" width="10" height="7" rx="1.5" fill="#0f172a"/>
      <g class="cy-m cy-n"><circle class="cy-eye" cx="43" cy="43.5" r="2" fill="#22d3ee"/><circle class="cy-eye" cx="53" cy="43.5" r="1.7" fill="#1c1917"/><path d="M44 50 L52 50" stroke="#7a4a3a" stroke-width="1.3" stroke-linecap="round"/></g>
      <g class="cy-m cy-h"><circle cx="43" cy="43.5" r="2" fill="#22d3ee"/><path d="M51 44 q2-2 4 0" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/><path d="M44 50 Q48 53 52 50" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="cy-m cy-s"><circle cx="43" cy="43.5" r="2" fill="#60a5fa"/><circle cx="53" cy="44.5" r="1.6" fill="#1c1917"/><path d="M44 51 Q48 48 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="cy-m cy-a"><circle cx="43" cy="43.5" r="2" fill="#ef4444"/><circle cx="53" cy="43.5" r="1.7" fill="#ef4444"/><path d="M44 51 Q48 49 52 51" fill="none" stroke="#7a4a3a" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="cy-m cy-u"><circle cx="43" cy="43.5" r="2.6" fill="#fbbf24"/><circle cx="53" cy="43.5" r="2.2" fill="#1c1917"/><ellipse cx="48" cy="51" rx="2" ry="2.2" fill="#7a4a3a"/></g>
      <g class="cy-m cy-z"><path d="M41 43.5 h4" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/><path d="M51 44 q2 2 4 0" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="48" cy="51" rx="2" ry="1.2" fill="#7a4a3a"/></g>
    </g>
  </svg>