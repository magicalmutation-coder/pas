<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .cy-b{transform-box:fill-box;transform-origin:50% 100%;animation:cy-bob 3s ease-in-out infinite}
      .cy-m{display:none}
      svg[data-mood="neutral"] .cy-n,svg[data-mood="happy"] .cy-h,svg[data-mood="sad"] .cy-s,svg[data-mood="angry"] .cy-a,svg[data-mood="surprised"] .cy-u,svg[data-mood="sleeping"] .cy-z{display:inline}
      .cy-eye{animation:cy-blink 4.4s infinite}
      @keyframes cy-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
      @keyframes cy-blink{0%,92%,100%{opacity:1}96%{opacity:.2}}
    </style>
    <g class="cy-b">
