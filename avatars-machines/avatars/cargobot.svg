      <g class="cg-m cg-n"><rect class="cg-eye" x="39" y="38" width="7" height="4" rx="1" fill="#fbbf24"/><rect class="cg-eye" x="50" y="38" width="7" height="4" rx="1" fill="#fbbf24"/><rect x="44" y="48" width="8" height="2" fill="#57534e"/></g>
      <g class="cg-m cg-h"><path d="M39 41 L42 37 L45 41" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/><path d="M51 41 L54 37 L57 41" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/><path d="M44 48 q4 3 8 0" fill="none" stroke="#57534e" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="cg-m cg-s"><rect x="39" y="39" width="7" height="3" fill="#60a5fa"/><rect x="50" y="39" width="7" height="3" fill="#60a5fa"/><path d="M45 49 q3-2 6 0" fill="none" stroke="#57534e" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="cg-m cg-a"><path d="M38 37 L45 40" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M58 37 L51 40" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><rect x="39" y="40" width="7" height="3" fill="#ef4444"/><rect x="50" y="40" width="7" height="3" fill="#ef4444"/></g>
      <g class="cg-m cg-u"><rect x="39" y="38" width="8" height="6" rx="1" fill="#fbbf24"/><rect x="49" y="38" width="8" height="6" rx="1" fill="#fbbf24"/><ellipse cx="48" cy="49" rx="2.2" ry="2.4" fill="#57534e"/></g>
