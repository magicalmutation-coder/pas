<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .cg-b{transform-box:fill-box;transform-origin:50% 100%;animation:cg-bob 3.2s ease-in-out infinite}
      .cg-m{display:none}
      svg[data-mood="neutral"] .cg-n,svg[data-mood="happy"] .cg-h,svg[data-mood="sad"] .cg-s,svg[data-mood="angry"] .cg-a,svg[data-mood="surprised"] .cg-u,svg[data-mood="sleeping"] .cg-z{display:inline}
      .cg-eye{animation:cg-blink 3.8s infinite}
      @keyframes cg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
      @keyframes cg-blink{0%,91%,100%{opacity:1}95%{opacity:.2}}
    </style>
