<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .nb-b{transform-box:fill-box;transform-origin:50% 50%;animation:nb-float 2.2s ease-in-out infinite}
      .nb-m{display:none}
      svg[data-mood="neutral"] .nb-n,svg[data-mood="happy"] .nb-h,svg[data-mood="sad"] .nb-s,svg[data-mood="angry"] .nb-a,svg[data-mood="surprised"] .nb-u,svg[data-mood="sleeping"] .nb-z{display:inline}
      .nb-eye{animation:nb-blink 3s infinite}
      .nb-orbit{transform-box:fill-box;transform-origin:50% 50%;animation:nb-spin 4s linear infinite}
      @keyframes nb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes nb-blink{0%,88%,100%{opacity:1}93%{opacity:.2}}
      @keyframes nb-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
    <g class="nb-b">
      <circle class="nb-orbit" cx="48" cy="48" r="28" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 6" opacity=".55"/>
      <circle cx="48" cy="48" r="18" fill="#1f2937" stroke="#334155" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="12" fill="#0f172a"/>
      <g class="nb-m nb-n"><circle class="nb-eye" cx="44" cy="47" r="2.4" fill="#22d3ee"/><circle class="nb-eye" cx="52" cy="47" r="2.4" fill="#22d3ee"/><path d="M45 53 h6" stroke="#334155" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="nb-m nb-h"><path d="M42 48 q2-2.4 4 0" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M50 48 q2-2.4 4 0" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M45 53 q3 2 6 0" fill="none" stroke="#334155" stroke-width="1.3" stroke-linecap="round"/></g>
      <g class="nb-m nb-s"><circle cx="44" cy="48" r="2" fill="#60a5fa"/><circle cx="52" cy="48" r="2" fill="#60a5fa"/><path d="M45 54 q3-2 6 0" fill="none" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/></g>
      <g class="nb-m nb-a"><path d="M41 45 L46 47" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M55 45 L50 47" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="44" cy="48" r="2" fill="#ef4444"/><circle cx="52" cy="48" r="2" fill="#ef4444"/></g>
      <g class="nb-m nb-u"><circle cx="44" cy="47" r="3" fill="#fbbf24"/><circle cx="52" cy="47" r="3" fill="#fbbf24"/><ellipse cx="48" cy="54" rx="2.2" ry="2.4" fill="#334155"/></g>
      <g class="nb-m nb-z"><path d="M42 48 h4" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M50 48 h4" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M45 54 h6" stroke="#334155" stroke-width="1.3" stroke-linecap="round"/></g>
      <circle cx="22" cy="30" r="2" fill="#22d3ee" opacity=".7"/><circle cx="74" cy="64" r="1.6" fill="#22d3ee" opacity=".6"/><circle cx="68" cy="26" r="1.4" fill="#22d3ee" opacity=".6"/>
    </g>
  </svg>