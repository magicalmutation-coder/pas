<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .an-b{transform-box:fill-box;transform-origin:50% 100%;animation:an-bob 2.6s ease-in-out infinite}
      .an-m{display:none}
      svg[data-mood="neutral"] .an-n,svg[data-mood="happy"] .an-h,svg[data-mood="sad"] .an-s,svg[data-mood="angry"] .an-a,svg[data-mood="surprised"] .an-u,svg[data-mood="sleeping"] .an-z{display:inline}
      .an-eye{animation:an-blink 4s infinite}
      @keyframes an-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
      @keyframes an-blink{0%,92%,100%{opacity:1}95%{opacity:.3}}
    </style>
    <g class="an-b">
