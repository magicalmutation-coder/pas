      <rect x="36" y="32" width="24" height="10" rx="3" fill="#0f172a"/>
      <line x1="48" y1="24" x2="48" y2="16" stroke="#475569" stroke-width="2"/><circle cx="48" cy="14" r="2.5" fill="#22d3ee"/>
      <g class="an-m an-n"><rect class="an-eye" x="40" y="35" width="6" height="4" rx="1" fill="#22d3ee"/><rect class="an-eye" x="50" y="35" width="6" height="4" rx="1" fill="#22d3ee"/><rect x="44" y="46" width="8" height="2" rx="1" fill="#334155"/></g>
      <g class="an-m an-h"><path d="M40 37 L43 34 L46 37" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/><path d="M50 37 L53 34 L56 37" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/><path d="M43 47 Q48 50 53 47" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="an-m an-s"><rect class="an-eye" x="40" y="36" width="6" height="3" rx="1" fill="#60a5fa"/><rect class="an-eye" x="50" y="36" width="6" height="3" rx="1" fill="#60a5fa"/><path d="M43 47 Q48 45 53 47" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="an-m an-a"><path d="M39 35 L45 37" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M57 35 L51 37" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" fill="none"/><rect class="an-eye" x="40" y="36" width="6" height="3" rx="1" fill="#ef4444"/><rect class="an-eye" x="50" y="36" width="6" height="3" rx="1" fill="#ef4444"/><path d="M43 47 Q48 45 53 47" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="an-m an-u"><circle cx="43" cy="36" r="2.4" fill="#fbbf24"/><circle cx="53" cy="36" r="2.4" fill="#fbbf24"/><ellipse cx="48" cy="47" rx="2" ry="2.2" fill="#334155"/></g>
      <g class="an-m an-z"><path d="M40 36 L46 36" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M50 36 L56 36" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="48" cy="47" rx="2" ry="1" fill="#334155"/></g>
