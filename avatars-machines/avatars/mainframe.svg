<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .mf-b{transform-box:fill-box;transform-origin:50% 100%;animation:mf-bob 4s ease-in-out infinite}
      .mf-m{display:none}
      svg[data-mood="neutral"] .mf-n,svg[data-mood="happy"] .mf-h,svg[data-mood="sad"] .mf-s,svg[data-mood="angry"] .mf-a,svg[data-mood="surprised"] .mf-u,svg[data-mood="sleeping"] .mf-z{display:inline}
      .mf-led{animation:mf-blink 1.2s steps(1) infinite}
      @keyframes mf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
      @keyframes mf-blink{0%,49%{opacity:1}50%,100%{opacity:.3}}
    </style>
    <g class="mf-b">
