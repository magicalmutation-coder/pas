      <rect x="24" y="40" width="48" height="26" rx="2" fill="#0f172a"/>
      <rect x="24" y="70" width="48" height="6" rx="1" fill="#1e293b"/>
      <circle cx="30" cy="73" r="1.2" fill="#22d3ee"/><circle cx="38" cy="73" r="1.2" fill="#22d3ee"/>
      <g class="mf-m mf-n"><rect x="32" y="48" width="8" height="4" rx="1" fill="#22d3ee"/><rect x="46" y="48" width="8" height="4" rx="1" fill="#22d3ee"/><rect x="40" y="58" width="6" height="2" fill="#334155"/></g>
      <g class="mf-m mf-h"><path d="M32 51 L36 47 L40 51" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M46 51 L50 47 L54 51" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/><path d="M38 59 q4 3 8 0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></g>
      <g class="mf-m mf-s"><rect x="32" y="49" width="8" height="3" fill="#60a5fa"/><rect x="46" y="49" width="8" height="3" fill="#60a5fa"/><path d="M40 59 q4-2 6 0" fill="none" stroke="#334155" stroke-width="1.4" stroke-linecap="round"/></g>
      <g class="mf-m mf-a"><path d="M31 47 L39 50" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M55 47 L47 50" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/><rect x="32" y="50" width="8" height="3" fill="#ef4444"/><rect x="46" y="50" width="8" height="3" fill="#ef4444"/></g>
      <g class="mf-m mf-u"><rect x="32" y="47" width="9" height="6" rx="1" fill="#fbbf24"/><rect x="45" y="47" width="9" height="6" rx="1" fill="#fbbf24"/><rect x="38" y="59" width="10" height="3" fill="#334155"/></g>
      <g class="mf-m mf-z"><rect x="32" y="49" width="8" height="2" fill="#22d3ee"/><rect x="46" y="49" width="8" height="2" fill="#22d3ee"/><rect x="40" y="59" width="6" height="2" fill="#334155"/></g>
    </g>
  </svg>