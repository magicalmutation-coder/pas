<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  :root{--panel:#0c121b;--warn:#fbbf24;--good:#34d399}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  body{padding:16px}
  header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
  .bar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=date]{background:#0b1020;border:1px solid var(--line);border-radius:7px;color:var(--txt);font:12px var(--sans);padding:5px 8px}
  button{font:600 12px var(--sans);padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#131a2e;color:var(--txt);cursor:pointer}
  button:hover{border-color:var(--cyan,#22d3ee);color:var(--cyan,#22d3ee)}
  button:disabled{opacity:.55;cursor:default}
  #state{font-size:11.5px;color:var(--dim2)}
  #state.dirty{color:var(--warn)}
  .wrap{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .left{max-height:calc(100vh - 90px);display:flex;flex-direction:column}
  input[type=text]{width:100%;background:#0b1020;border:1px solid var(--line);border-radius:7px;color:var(--txt);font:12px var(--sans);padding:6px 8px;outline:none;margin:0 0 8px}
  input[type=text]:focus{border-color:var(--cyan,#22d3ee)}
  .days{overflow:auto;flex:1 1 auto}
  .day{padding:5px 7px;border-radius:7px;cursor:pointer}
  .day:hover{background:#141d33}
  .day.on{background:#1b2440;color:var(--cyan,#22d3ee)}
  .day .d{font-weight:600}
  .day .t{font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  textarea{width:100%;min-height:62vh;background:#0b1220;border:1px solid var(--line);border-radius:10px;color:var(--txt);
    font:14px/1.65 var(--sans);padding:14px;outline:none;resize:vertical}
  textarea:focus{border-color:var(--cyan,#22d3ee)}
  .muted{color:var(--dim2);font-size:11.5px}
  .err{color:#fca5a5;font-size:12px}
  @media (max-width:800px){.wrap{grid-template-columns:1fr}.left{max-height:220px}}
</style>
</head>
<body>
<header>
  <h1>Daybook</h1>
  <input type="date" id="date">
  <button id="prev" title="previous day">‹</button>
  <button id="next" title="next day">›</button>
  <span class="bar">
    <span id="state">saved</span>
    <button id="draft">draft the day</button>
    <button id="save">save</button>
  </span>
</header>

<div class="wrap">
  <div class="card left">
    <input type="text" id="find" placeholder="Search days" spellcheck="false">
    <div class="days" id="days"><div class="muted">loading…</div></div>
  </div>
  <div class="card">
    <textarea id="text" placeholder="What happened today…" spellcheck="false"></textarea>
    <div class="muted" id="note"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

let DAYS = [], CUR = '', DIRTY = false, MODEL = { model: '', engine: '' }, TIMER = 0;

async function api(url, opts) {
  try { const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {})); const j = await r.json().catch(() => null); return j || { ok: false, error: 'HTTP ' + r.status }; }
  catch (e) { return { ok: false, error: String(e) }; }
}
function setDirty(on) { DIRTY = !!on; $('state').textContent = on ? 'unsaved' : 'saved'; $('state').className = on ? 'dirty' : ''; }

async function loadList() {
  const r = await api('/api/modules/daybook/list');
  DAYS = (r && r.ok && r.days) || [];
  paintList();
}
function paintList() {
  const q = ($('find').value || '').trim().toLowerCase();
  const rows = DAYS.filter(d => !q || (d.date + ' ' + d.title).toLowerCase().includes(q));
  $('days').innerHTML = rows.length
    ? rows.map(d => '<div class="day' + (d.date === CUR ? ' on' : '') + '" data-date="' + esc(d.date) + '"><div class="d">' + esc(d.date) + '</div><div class="t">' + esc(d.title) + '</div></div>').join('')
    : '<div class="muted">no entries</div>';
}
$('days').addEventListener('click', ev => {
  const d = ev.target.closest('.day');
  if (d) openDay(d.dataset.date);
});
$('find').addEventListener('input', paintList);

async function openDay(date) {
  if (DIRTY && !confirm('Discard the unsaved changes to ' + CUR + '?')) return;
  CUR = date;
  $('date').value = date;
  paintList();
  const r = await api('/api/modules/daybook/entry?date=' + encodeURIComponent(date));
  $('text').value = (r && r.ok && r.text) || '';
  setDirty(false);
  $('note').textContent = '';
  $('text').focus();
}

$('date').addEventListener('change', () => { if ($('date').value) openDay($('date').value); });
$('prev').onclick = () => { const d = new Date(CUR + 'T12:00:00'); d.setDate(d.getDate() - 1); openDay(ymd(d)); };
$('next').onclick = () => { const d = new Date(CUR + 'T12:00:00'); d.setDate(d.getDate() + 1); openDay(ymd(d)); };
$('text').addEventListener('input', () => setDirty(true));
$('text').addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); } });

async function save() {
  if (!CUR) return;
  const b = $('save'); b.disabled = true; b.textContent = 'saving…';
  const r = await api('/api/modules/daybook/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date: CUR, text: $('text').value }) });
  b.disabled = false; b.textContent = 'save';
  if (r && r.ok) { setDirty(false); $('note').textContent = 'saved ' + CUR + ' (' + r.bytes + ' characters)'; loadList(); }
  else { $('note').textContent = 'could not save: ' + ((r && r.error) || 'unknown'); $('note').className = 'err'; }
}
$('save').onclick = save;

$('draft').onclick = async () => {
  if (!CUR) return;
  if (!MODEL.model) {
    const a = await api('/api/agent?limit=1');
    if (a && a.ok) MODEL = { model: a.lastModel || '', engine: a.lastEngine || 'ollama' };
  }
  if (!MODEL.model) { $('note').className = 'err'; $('note').textContent = 'No model on the Agent bar: open Chat once and pick one.'; return; }
  const b = $('draft'); b.disabled = true; b.textContent = 'gathering…';
  const start = new Date(CUR + 'T00:00:00').getTime() / 1000, end = start + 86400;
  const [agent, notes, mems] = await Promise.all([
    api('/api/agent?limit=500'), api('/api/modules/notes/list'), api('/api/memories?limit=200')
  ]);
  const runs = ((agent && agent.jobs) || []).filter(j => Number(j.created) >= start && Number(j.created) < end);
  const nts = ((notes && notes.notes) || []).filter(n => Number(n.updated) >= start && Number(n.updated) < end);
  const mem = ((mems && mems.memories) || []).filter(m => Number(m.at) >= start && Number(m.at) < end);
  if (!runs.length && !nts.length && !mem.length) {
    b.disabled = false; b.textContent = 'draft the day';
    $('note').className = 'muted';
    $('note').textContent = 'nothing dated that day to draft from - write it yourself.';
    return;
  }
  const data = [
    runs.length ? 'Runs: ' + runs.slice(0, 12).map(j => String(j.objective || '').slice(0, 80) + ' [' + j.status + ']').join(' | ') : '',
    nts.length ? 'Notes touched: ' + nts.map(n => n.title).slice(0, 8).join(', ') : '',
    mem.length ? 'Memories saved: ' + mem.slice(0, 10).map(m => String(m.text || '').slice(0, 100)).join(' | ') : ''
  ].filter(Boolean).join('\n');
  const objective = 'Write a diary entry for ' + CUR + ' in the first person, 4-6 sentences, no headings or bullets. ' +
    'Use only this data and do not invent anything:\n' + data;
  b.textContent = 'writing…';
  const r = await api('/api/agent/jobs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ objective, model: MODEL.model, engine: MODEL.engine || 'ollama', maxSteps: 2, maxSeconds: 120 })
  });
  if (!r || !r.ok) { b.disabled = false; b.textContent = 'draft the day'; $('note').className = 'err'; $('note').textContent = 'could not start: ' + ((r && r.error) || 'unknown'); return; }
  let ticks = 0;
  TIMER = setInterval(async () => {
    ticks++;
    if (ticks > 60) { clearInterval(TIMER); TIMER = 0; b.disabled = false; b.textContent = 'draft the day'; $('note').textContent = 'the run is taking too long; it continues in Chat.'; return; }
    const j = await api('/api/agent/jobs/' + encodeURIComponent(r.id));
    if (!j || !j.ok || !j.job) return;
    if (!['done', 'failed', 'stopped', 'cancelled'].includes(j.job.status)) return;
    clearInterval(TIMER); TIMER = 0;
    b.disabled = false; b.textContent = 'draft again';
    const steps = j.job.steps || [];
    const said = steps.filter(s => s.kind === 'assistant' && String(s.text || '').trim()).slice(-1)[0];
    if (said) { $('text').value = String(said.text).trim(); setDirty(true); $('note').className = 'muted'; $('note').textContent = 'draft ready - edit it, then save.'; }
    else { $('note').className = 'err'; $('note').textContent = 'the run ended ' + j.job.status + ' with no answer.'; }
  }, 2000);
};

(async () => {
  const a = await api('/api/agent?limit=1');
  if (a && a.ok) MODEL = { model: a.lastModel || '', engine: a.lastEngine || 'ollama' };
  await loadList();
  await openDay(ymd(new Date()));
})();
</script>
</body>
</html>
