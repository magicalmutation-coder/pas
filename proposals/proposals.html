<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposals - poweragent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.55 var(--sans);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0b1220,#080d16);flex-wrap:wrap}
header h1{margin:0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#cfe4ff;font-weight:600}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:5px 11px;font:12.5px var(--sans);cursor:pointer}
.seg button.on{background:#152840;color:#dcecff}
header input{background:#0c1421;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 10px;
  font:13px var(--sans);outline:none;width:220px}
button.act{background:#14304a;border:1px solid #274d70;color:#dcecff;border-radius:8px;padding:6px 12px;
  font:13px var(--sans);cursor:pointer}
button.act:hover{background:#1a3d5e}
button.ghost{background:transparent;border-color:var(--line);color:#9fb0cc}
button.ghost:hover{border-color:var(--cyan);color:var(--txt)}

#wrap{display:grid;grid-template-columns:1fr 380px;min-height:0}
@media(max-width:900px){#wrap{grid-template-columns:1fr}#detail{display:none}}
#list{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f7f9c;font-weight:600;
  position:sticky;top:0;background:#080d16;z-index:2}
tr.row{cursor:pointer}
tr.row:hover{background:#0e1826}
tr.row.sel{background:#132135}
td.id{color:#5d6a84;font-family:var(--mono);font-size:12px;width:44px}
td.title{font-weight:500;color:#e6eeff}
td.title .body{color:#7d8ba6;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
td .who{color:#93a0bb;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:#9fb0cc}
.tag.open{color:#ffd479;border-color:#5d4a17}
.tag.done{color:#8ef0b8;border-color:#1d4a37}
.tag.rejected{color:#ffb4b4;border-color:#5d2a2a}
.empty{padding:34px;text-align:center;color:var(--dim)}

#detail{border-left:1px solid var(--line);background:linear-gradient(180deg,#0a1018,#070b12);
  padding:16px 16px 26px;overflow:auto}
#detail h2{margin:0 0 3px;font-size:16px}
#detail .meta{color:#7c8cab;font-size:12.5px}
#detail h4{margin:16px 0 5px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7c8cab}
#detail .body{white-space:pre-wrap;color:#c3cee2;font-size:13.5px}
#detail input,#detail textarea{background:#0c1421;color:var(--txt);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font:13px var(--sans);width:100%;outline:none}
#detail textarea{resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16253c;border:1px solid #2c4767;
  color:#dbeeff;border-radius:9px;padding:7px 14px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
</style></head>
<body>
<div id="app">
  <header>
    <h1>Proposals</h1>
    <span class="seg" id="seg">
      <button data-status="open" class="on">open</button>
      <button data-status="done">done</button>
      <button data-status="rejected">declined</button>
      <button data-status="">everything</button>
    </span>
    <span class="sp"></span>
    <input id="find" placeholder="search title, bot, target…">
    <button class="act ghost" id="scan">scan runs</button>
    <button class="act" id="file">+ file one</button>
  </header>
  <div id="wrap">
    <div id="list"><div class="empty">reading the queue…</div></div>
    <aside id="detail"><div class="empty">pick a proposal</div></aside>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let STATUS = "open", ALL = [], PICK = null, FIND = "";

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),2600); }
function when(unix){
  if (!unix) return "";
  const d = new Date(Number(unix) * 1000);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + " " + d.toTimeString().slice(0,5);
}
async function api(path, body){
  const opt = body === undefined ? {cache:"no-store"} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  const r = await fetch("/api/agent/proposals" + path, opt).then(x => x.json()).catch(() => null);
  if (!r || !r.ok) throw new Error((r && r.error) || "the server refused it");
  return r;
}

async function load(){
  let r = null;
  try { r = await api("?status=" + encodeURIComponent(STATUS)); } catch (e) { $("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  ALL = r.proposals || [];
  render();
}

function render(){
  const term = FIND.trim().toLowerCase();
  const rows = ALL.filter(p => !term || [p.title, p.bot, p.target, p.kind, p.body].filter(Boolean).join(" ").toLowerCase().includes(term));
  if (!rows.length){
    $("list").innerHTML = '<div class="empty">' + (term ? "nothing matches “" + esc(term) + "”" : (STATUS === "open" ? "the queue is empty - press <b>scan runs</b> to mine what the crew already said, or <b>+ file one</b>" : "nothing here")) + '</div>';
    return;
  }
  $("list").innerHTML = '<table><thead><tr><th>#</th><th>what</th><th>who</th><th>status</th><th>decided</th></tr></thead><tbody>' +
    rows.map(p => '<tr class="row' + (PICK && PICK.id === p.id ? " sel" : "") + '" data-id="' + p.id + '">' +
      '<td class="id">' + p.id + '</td>' +
      '<td class="title">' + esc(p.title) + (p.target ? ' <span class="tag">' + esc(p.target) + '</span>' : '') +
        '<div class="body">' + esc((p.body || "").replace(/\s+/g, " ")) + '</div></td>' +
      '<td class="who">' + esc(p.bot) + '<div style="color:#5d6a84;font-size:11px">' + esc(p.kind) + '</div></td>' +
      '<td><span class="tag ' + esc(p.status) + '">' + esc(p.status) + '</span></td>' +
      '<td class="who">' + esc(when(p.decided_at)) + '</td></tr>').join("") + '</tbody></table>';
}

function detail(){
  const p = PICK;
  if (!p){ $("detail").innerHTML = '<div class="empty">pick a proposal</div>'; return; }
  const open = p.status === "open";
  $("detail").innerHTML =
    '<h2>#' + p.id + ' · ' + esc(p.title) + '</h2>' +
    '<div class="meta">' + esc(p.bot) + ' · ' + esc(p.kind) + (p.target ? ' · ' + esc(p.target) : '') +
    ' · <span class="tag ' + esc(p.status) + '">' + esc(p.status) + '</span></div>' +
    (open
      ? '<h4>Title</h4><input id="dTitle" value="' + esc(p.title) + '">' +
        '<h4>Why, and what should be built</h4><textarea id="dBody" rows="8">' + esc(p.body || "") + '</textarea>' +
        '<h4>Target (optional)</h4><input id="dTarget" value="' + esc(p.target || "") + '" placeholder="modules\\tank, or Home">' +
        '<div class="btns"><button class="act" id="dApprove">Approve and start a run</button>' +
        '<button class="act ghost" id="dSave">Save edits</button>' +
        '<button class="act ghost" id="dReject">Decline</button></div>'
      : '<h4>Why, and what should be built</h4><div class="body">' + esc(p.body || "(nothing was written)") + '</div>' +
        '<h4>Run</h4><div class="body"><span style="font-family:var(--mono)">' + esc(p.run || "—") + '</span></div>' +
        '<div class="btns"><button class="act ghost" id="dCopy">Copy the run id</button>' +
        '<button class="act" id="dShip">Package the app</button>' +
        '<button class="act ghost" id="dPublish">Publish to a store</button></div>' +
        '<div style="color:#6f7f9c;font-size:11.5px;margin-top:8px">Shipping only works when the target names an installed app.</div>');

  if (open){
    $("dSave").onclick = async () => {
      try {
        await api("/update", { id: p.id, title: $("dTitle").value, body: $("dBody").value, target: $("dTarget").value });
        toast("saved"); await load(); PICK = ALL.find(x => x.id === p.id) || null; detail();
      } catch (e) { toast(e.message); }
    };
    $("dApprove").onclick = async () => {
      if (!confirm("Approve #" + p.id + "?\n\nThis starts a run that may change files.")) return;
      try { const r = await api("/approve", { id: p.id }); toast("approved - run " + r.run + " (" + r.bot + ")"); await load(); PICK = null; detail(); }
      catch (e) { toast(e.message); }
    };
    $("dReject").onclick = async () => {
      try { await api("/reject", { id: p.id }); toast("declined"); await load(); PICK = null; detail(); }
      catch (e) { toast(e.message); }
    };
  } else {
    $("dCopy").onclick = () => { try { navigator.clipboard.writeText(p.run || ""); toast("copied"); } catch (e) { } };
    $("dShip").onclick = async () => {
      const app = appFor(p.target);
      if (!app){ toast("no installed app matches that target"); return; }
      try { const r = await fetch("/api/apps/export", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name: app})}).then(x => x.json()); toast(r && r.ok ? ("package written: " + (r.package && r.package.zip)) : ((r && r.error) || "could not package")); }
      catch (e) { toast("could not package"); }
    };
    $("dPublish").onclick = async () => {
      const app = appFor(p.target);
      if (!app){ toast("no installed app matches that target"); return; }
      const store = prompt("Publish " + app + " to which store? (its name from Apps > App Store)", "");
      if (!store) return;
      try { const r = await fetch("/api/store/publish", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({app: app, store: store.trim(), commit: true})}).then(x => x.json()); toast(r && r.ok ? ("published to " + store.trim()) : ((r && r.error) || "could not publish")); }
      catch (e) { toast("could not publish"); }
    };
  }
}

let APPS = [];
async function loadApps(){
  try { const r = await fetch("/api/apps?light=1", {cache:"no-store"}).then(x => x.json()); APPS = (r && r.apps) || []; } catch (e) { APPS = []; }
}
function appFor(target){
  const want = String(target || "").replace(/^modules[\\/]/i, "").toLowerCase().replace(/\s+/g, "-");
  if (!want) return "";
  const hit = APPS.find(a => a.kind === "module" && (a.name === "module:" + want ||
    String(a.folder || "").toLowerCase().endsWith("\\" + want) ||
    String(a.label || "").toLowerCase() === String(target).toLowerCase()));
  return hit ? hit.name.replace(/^module:/, "") : "";
}

$("seg").addEventListener("click", ev => {
  const b = ev.target.closest("[data-status]");
  if (!b) return;
  for (const x of $("seg").querySelectorAll("button")) x.classList.toggle("on", x === b);
  STATUS = b.dataset.status;
  PICK = null; detail(); load();
});
$("find").addEventListener("input", ev => { FIND = ev.target.value; render(); });
$("list").addEventListener("click", ev => {
  const tr = ev.target.closest("tr[data-id]");
  if (!tr) return;
  PICK = ALL.find(p => String(p.id) === tr.dataset.id) || null;
  render(); detail();
});
$("scan").onclick = async () => {
  toast("reading the recent runs…");
  try { const r = await api("/scan", { max: 12 }); toast("found " + r.candidates + ", kept " + r.created + (r.retitled ? ", retitled " + r.retitled : "") + (r.merged ? ", merged " + r.merged : "")); }
  catch (e) { toast(e.message); }
  load();
};
$("file").onclick = () => {
  const title = prompt("One line: what should change?");
  if (!title) return;
  const body = prompt("Why, and the smallest fix (optional):", "") || "";
  api("", { title: title, body: body }).then(() => { toast("added"); load(); }).catch(e => toast(e.message));
};

loadApps();
load();
setInterval(load, 20000);
</script>
</body></html>
