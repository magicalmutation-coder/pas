<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - poweragent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 var(--sans)}
#wrap{max-width:1120px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{margin:0;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#cfe4ff;font-weight:600}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--dim)}
.chip.bad{border-color:#5d2a2a;color:#ffb4b4;background:#2a1414}
.chip.warn{border-color:#5d4a17;color:#ffd479;background:#2a2210}
.chip.ok{border-color:#1d4a37;color:#8ef0b8;background:#0f2a20}
header .sp{flex:1}
button{background:#14304a;border:1px solid #274d70;color:#dcecff;border-radius:8px;padding:6px 12px;
  font:13px var(--sans);cursor:pointer}
button:hover{background:#1a3d5e}
button.ghost{background:transparent;border-color:var(--line);color:#9fb0cc}
button.ghost:hover{border-color:var(--cyan);color:var(--txt)}
input,select,textarea{background:#0c1421;color:var(--txt);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font:13px var(--sans);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#2a4a6a}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7c8cab;margin:0 0 3px}

.alert{border:1px solid #5d2a2a;background:#1d1010;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.alert.soon{border-color:#5d4a17;background:#1d1910}
.alert b{color:#ffd9d9}
.alert .line{display:flex;gap:8px;padding:2px 0;font-size:13px}
.alert .line span:first-child{color:#ffb4b4;min-width:56px;text-transform:uppercase;font-size:11px;letter-spacing:.08em;padding-top:2px}

.car{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.car .head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.car .head h2{margin:0;font-size:15.5px}
.car .head .reg{font-family:var(--mono);font-size:12px;background:#111a2d;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:#cfe4ff;text-transform:uppercase}
.car .head .meta{color:var(--dim);font-size:12px}
.car .head .sp{flex:1}
.car .head .st{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.car .head .st.overdue{color:var(--red)}
.car .head .st.soon{color:var(--amber)}
.car .head .st.ok{color:var(--green)}
.car table{width:100%;border-collapse:collapse}
.car th,.car td{text-align:left;padding:7px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.car th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f7f9c;font-weight:600}
.car tr:last-child td{border-bottom:0}
.car .k{text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:#a8b6d2}
.car .when{font-family:var(--mono);font-size:12px}
.car .days{font-size:11.5px}
.car .days.bad{color:var(--red)}
.car .days.warn{color:var(--amber)}
.car .days.ok{color:#6f8fa8}
.car .act{white-space:nowrap;text-align:right}
.car .act button{padding:2px 8px;font-size:11.5px;margin-left:4px}
.car .addrow{padding:10px 14px;background:#0a111c;display:grid;grid-template-columns:120px 150px 110px 1fr auto;
  gap:8px;align-items:end}
@media(max-width:760px){.car .addrow{grid-template-columns:1fr 1fr}}
.empty{border:1px dashed #24364f;border-radius:12px;padding:28px;text-align:center;color:var(--dim)}

#modal{position:fixed;inset:0;background:rgba(3,6,11,.7);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#sheet{width:min(520px,92vw);background:#0c1523;border:1px solid #263a55;border-radius:14px;padding:16px 18px}
#sheet h3{margin:0 0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16253c;border:1px solid #2c4767;
  color:#dbeeff;border-radius:9px;padding:7px 14px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#leadDays{width:46px;background:transparent;border:0;color:inherit;font:inherit;text-align:right;padding:0}
</style></head>
<body>
<div id="wrap">
  <header>
    <h1>Home</h1>
    <span class="chip" id="cVeh">no vehicles</span>
    <span class="chip ok" id="cOk">nothing due</span>
    <span class="chip warn" id="cSoon" style="display:none"></span>
    <span class="chip bad" id="cOver" style="display:none"></span>
    <label class="chip" id="leadWrap" style="display:none" title="How many days before a renewal to warn">warn
      <input id="leadDays" type="number" min="1" max="365" aria-label="days before due"> d ahead</label>
    <span class="sp"></span>
    <button id="addCar">+ vehicle</button>
  </header>

  <section id="alerts"></section>
  <section id="cars"><div class="empty">reading the garage…</div></section>
</div>

<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let STATE = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),2600); }
async function api(path, body){
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"};
  const r = await fetch("/api/modules/home/" + path, opt).then(x=>x.json()).catch(()=>null);
  if (!r || !r.ok) throw new Error((r && r.error) || "the server refused it");
  return r;
}

function dayLabel(days){
  const lead = (STATE && STATE.settings && STATE.settings.leadDays) || 30;
  if (days === null || days === undefined) return {text:"no date", cls:"ok"};
  if (days < 0) return {text:"overdue " + Math.abs(days) + "d", cls:"bad"};
  if (days === 0) return {text:"today", cls:"bad"};
  if (days <= lead) return {text:"in " + days + "d", cls:"warn"};
  return {text:"in " + days + "d", cls:"ok"};
}

async function load(){
  let r = null;
  try { r = await api("state"); } catch(e) { $("cars").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  STATE = r;
  if ($("leadDays")) $("leadDays").value = (r.settings && r.settings.leadDays) || 30;
  if ($("leadWrap") && r.settings) $("leadWrap").style.display = "inline-flex";
  render();
}

function render(){
  const s = STATE;
  const lead = (s.settings && s.settings.leadDays) || 30;
  $("cVeh").textContent = s.summary.vehicles + (s.summary.vehicles === 1 ? " vehicle" : " vehicles");
  $("cOk").style.display = s.summary.overdue || s.summary.soon ? "none" : "inline-block";
  $("cSoon").style.display = s.summary.soon ? "inline-block" : "none";
  $("cOver").style.display = s.summary.overdue ? "inline-block" : "none";
  $("cSoon").textContent = s.summary.soon + " due soon";
  $("cOver").textContent = s.summary.overdue + " overdue";

  // Everything overdue or due soon, worst first: this is the only part of the
  // page that should be able to interrupt somebody.
  const lines = [];
  for (const v of s.vehicles) {
    for (const e of v.events) {
      if (!e.open || e.days === null) continue;
      if (e.days > lead) continue;
      lines.push({v, e});
    }
  }
  lines.sort((a,b)=>a.e.days-b.e.days);
  $("alerts").innerHTML = lines.length
    ? '<div class="alert' + (lines[0].e.days >= 0 ? ' soon' : '') + '"><b>' +
      (lines[0].e.days < 0 ? "Overdue" : "Coming up") + '</b>' +
      lines.map(x => '<div class="line"><span>' + esc(x.e.kind) + '</span><span>' + esc(x.v.name) +
        (x.v.reg ? ' · ' + esc(x.v.reg) : '') + ' — ' + esc(dayLabel(x.e.days).text) +
        (x.e.due ? ' (' + esc(x.e.due) + ')' : '') + '</span></div>').join("") + '</div>'
    : '';

  if (!s.vehicles.length) {
    $("cars").innerHTML = '<div class="empty"><b>No vehicles yet.</b><br>Add one and its MOT, tax and insurance dates - ' +
      'the page will count them down and tell you before they bite.<br><br>' +
      '<button id="addCar2">+ add the first vehicle</button></div>';
    if ($("addCar2")) $("addCar2").onclick = () => vehicleSheet(null);
    return;
  }

  $("cars").innerHTML = s.vehicles.map(v => {
    const rows = v.events.map(e => {
      const d = dayLabel(e.days);
      return '<tr data-ev="' + e.id + '">' +
        '<td class="k">' + esc(e.kind) + '</td>' +
        '<td class="when">' + esc(e.due || "—") + '</td>' +
        '<td class="days ' + (e.open ? d.cls : "ok") + '">' + (e.open ? esc(d.text) : "done") + '</td>' +
        '<td>' + esc(e.note || "") + (e.mileage ? ' <span style="color:#6f7f9c">@ ' + e.mileage + ' mi</span>' : '') + '</td>' +
        '<td class="act">' +
          (e.open ? '<button class="ghost" data-done="' + e.id + '" title="mark it renewed or done">done</button>' : '') +
          '<button class="ghost" data-del="' + e.id + '" title="delete this row">×</button>' +
        '</td></tr>';
    }).join("");
    return '<article class="car">' +
      '<div class="head"><h2>' + esc(v.name) + '</h2>' +
        (v.reg ? '<span class="reg">' + esc(v.reg) + '</span>' : '') +
        '<span class="meta">' + esc([v.make, v.model, v.year || ""].filter(Boolean).join(" ")) +
          (v.mileage ? ' · ' + v.mileage.toLocaleString() + ' mi' : '') + '</span>' +
        '<span class="sp"></span>' +
        '<span class="st ' + v.state + '">' + (v.state === "overdue" ? "overdue" : v.state === "soon" ? "due soon" : "ok") + '</span>' +
        '<button class="ghost" data-edit="' + v.id + '">edit</button>' +
        '<button class="ghost" data-delcar="' + v.id + '">delete</button></div>' +
      (v.events.length
        ? '<table><thead><tr><th>what</th><th>date</th><th>when</th><th>note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div style="padding:12px 14px;color:#6f7f9c;font-size:13px">no dates recorded - add the MOT, tax or insurance</div>') +
      '<div class="addrow" data-add="' + v.id + '">' +
        '<div><label>what</label><select data-field="kind">' +
          ['mot','tax','insurance','service','repair','other'].map(k=>'<option value="'+k+'">'+k+'</option>').join('') +
        '</select></div>' +
        '<div><label>date</label><input data-field="due" placeholder="2026-04-01"></div>' +
        '<div><label>mileage</label><input data-field="mileage" placeholder="' + (v.mileage || "") + '"></div>' +
        '<div><label>note</label><input data-field="note" placeholder="optional"></div>' +
        '<div><button data-addgo="' + v.id + '">add</button></div>' +
      '</div></article>';
  }).join("");
}

function vehicleSheet(v){
  const isNew = !v;
  $("sheet").innerHTML = '<h3>' + (isNew ? "Add a vehicle" : "Edit " + esc(v.name)) + '</h3>' +
    '<div class="grid2">' +
      '<div><label>name</label><input id="fName" value="' + esc(v ? v.name : "") + '" placeholder="Golf"></div>' +
      '<div><label>registration</label><input id="fReg" value="' + esc(v ? v.reg : "") + '" placeholder="AB12 CDE"></div>' +
      '<div><label>make</label><input id="fMake" value="' + esc(v ? v.make : "") + '"></div>' +
      '<div><label>model</label><input id="fModel" value="' + esc(v ? v.model : "") + '"></div>' +
      '<div><label>year</label><input id="fYear" value="' + esc(v && v.year ? v.year : "") + '" placeholder="2018"></div>' +
      '<div><label>mileage</label><input id="fMileage" value="' + esc(v && v.mileage ? v.mileage : "") + '"></div>' +
      '<div class="full"><label>notes</label><input id="fNotes" value="' + esc(v ? v.notes : "") + '"></div>' +
    '</div>' +
    '<div class="row"><button class="ghost" id="fCancel">cancel</button><button id="fSave">save</button></div>';
  $("modal").classList.add("on");
  $("fCancel").onclick = closeSheet;
  $("fSave").onclick = async () => {
    const body = { name: $("fName").value.trim(), reg: $("fReg").value.trim(), make: $("fMake").value.trim(),
      model: $("fModel").value.trim(), year: $("fYear").value.trim() ? Number($("fYear").value) : null,
      mileage: $("fMileage").value.trim() ? Number($("fMileage").value) : null, notes: $("fNotes").value.trim() };
    if (v) body.id = v.id;
    try { await api("vehicle", body); closeSheet(); toast("saved"); load(); }
    catch(e) { toast(e.message); }
  };
  $("fName").focus();
}
function closeSheet(){ $("modal").classList.remove("on"); }
$("modal").addEventListener("click", ev => { if (ev.target.id === "modal") closeSheet(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
$("addCar").onclick = () => vehicleSheet(null);
if ($("leadDays")) {
  $("leadDays").addEventListener("change", async () => {
    const days = parseInt($("leadDays").value) || 30;
    try { await api("settings", { leadDays: days }); toast("warns " + days + " days ahead"); load(); }
    catch(e) { toast(e.message); }
  });
}

document.addEventListener("click", async ev => {
  const t = ev.target;
  if (t.closest("[data-addgo]")) {
    const row = t.closest("[data-add]");
    const vehicle = Number(row.dataset.add);
    const get = f => { const el = row.querySelector('[data-field="' + f + '"]'); return el ? el.value.trim() : ""; };
    const body = { vehicle: vehicle, kind: get("kind"), due: get("due"), note: get("note") };
    if (get("mileage")) body.mileage = Number(get("mileage"));
    if (!body.due) { toast("a date is needed - 2026-04-01"); return; }
    try { await api("event", body); toast("recorded"); load(); } catch(e) { toast(e.message); }
    return;
  }
  const done = t.closest("[data-done]");
  if (done) {
    const card = done.closest(".car");
    const vehicleId = Number(card.querySelector("[data-add]").dataset.add);
    const evRow = Number(done.dataset.done);
    const v = STATE.vehicles.find(x => x.id === vehicleId);
    const e = v && v.events.find(x => x.id === evRow);
    if (!e) return;
    try { await api("event", { id: e.id, vehicle: vehicleId, kind: e.kind, due: e.due, done: true, note: e.note, mileage: e.mileage }); toast("marked done"); load(); }
    catch(err) { toast(err.message); }
    return;
  }
  const del = t.closest("[data-del]");
  if (del) {
    try { await api("remove", { kind: "event", id: Number(del.dataset.del) }); toast("removed"); load(); }
    catch(err) { toast(err.message); }
    return;
  }
  const edit = t.closest("[data-edit]");
  if (edit) { vehicleSheet(STATE.vehicles.find(x => x.id === Number(edit.dataset.edit))); return; }
  const delcar = t.closest("[data-delcar]");
  if (delcar) {
    const v = STATE.vehicles.find(x => x.id === Number(delcar.dataset.delcar));
    if (!v || !confirm("Delete " + v.name + " and its whole history?")) return;
    try { await api("remove", { kind: "vehicle", id: v.id }); toast("deleted"); load(); } catch(e) { toast(e.message); }
  }
});

load();
</script>
</body></html>
