      .cm-eye{animation:cm-blink 4.5s infinite}
      @keyframes cm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
      @keyframes cm-blink{0%,93%,100%{opacity:1}96%{opacity:.2}}
    </style>
