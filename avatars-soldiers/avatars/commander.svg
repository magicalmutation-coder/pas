<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" data-mood="neutral">
    <style>
      .cm-b{transform-box:fill-box;transform-origin:50% 100%;animation:cm-bob 3.3s ease-in-out infinite}
