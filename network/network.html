<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network - PowerAgent</title>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/embed.js"></script>
<style>
  :root{--panel:#0c121b;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--cyan:#22d3ee;--violet:#a78bfa}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans)}
  body{padding:16px}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  h1{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
  .chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11.5px;color:var(--dim)}
  .chip b{color:var(--txt)}
  .chip.good{border-color:rgba(52,211,153,.4);color:#bbf7d0}
  .chip.bad{border-color:rgba(248,113,113,.5);color:#fecaca}
  .bar{margin-left:auto;display:flex;gap:8px;align-items:center}
  button{font:600 12px var(--sans);padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#131a2e;color:var(--txt);cursor:pointer}
  button:hover{border-color:var(--cyan);color:var(--cyan)}
  #note{color:var(--dim2);font-size:11.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:0 0 8px}
  .big{font-size:26px;font-weight:600;line-height:1.1}
  .sub{color:var(--dim);font-size:12px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--dim)}
  .pill.bad{color:#fecaca;border-color:rgba(248,113,113,.45)}
  .pill.good{color:#bbf7d0;border-color:rgba(52,211,153,.4)}
  .issues{list-style:none;margin:0;padding:0;font-size:12px}
  .issues li{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);color:#fecaca}
  .issues li:last-child{border-bottom:0}
  .empty{color:var(--dim2);font-size:12px}
  .mapcard{padding:0;overflow:hidden;margin:0 0 12px}
  .maphead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .maphead h2{margin:0}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim2);margin-left:auto}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}
  .mapwrap{position:relative;height:430px;background:radial-gradient(circle at 50% 45%, #101a33 0%, #070b14 70%)}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #tip{position:absolute;pointer-events:none;background:#0b1220ee;border:1px solid var(--line);border-radius:8px;
    padding:5px 8px;font-size:11px;color:var(--txt);display:none;max-width:240px;line-height:1.4}
  #detail{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
  #detail b{color:var(--txt)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px;vertical-align:middle}
  .sig{display:inline-block;height:5px;border-radius:3px;background:#26314d;width:60px;vertical-align:middle;margin-right:6px;position:relative;overflow:hidden}
  .sig i{position:absolute;inset:0 auto 0 0;background:var(--good)}
  .muted{color:var(--dim2)}
  .right{text-align:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Network</h1>
  <span class="chip" id="wanChip">waiting…</span>
  <span class="chip" id="ipChip"></span>
  <span class="chip" id="latChip"></span>
  <span class="bar"><span id="note"></span><button id="refresh">refresh</button></span>
</header>

<div class="cards">
  <section class="card"><h2>WAN</h2>
    <div class="big" id="wanDown">—</div>
    <div class="sub" id="wanUp">—</div>
    <div class="sub" id="wanMore" style="margin-top:6px"></div>
  </section>
  <section class="card"><h2>Clients and devices</h2><div class="pills" id="counts"></div>
    <div class="sub" id="countsMore" style="margin-top:8px"></div>
  </section>
  <section class="card"><h2>Issues</h2><ul class="issues" id="issues"><li class="empty">loading…</li></ul></section>
  <section class="card"><h2>New in the last 24h</h2><div id="newdevs" class="empty">loading…</div></section>
</div>

<section class="card mapcard">
  <div class="maphead"><h2>3D map</h2>
    <span class="legend">
      <span><i style="background:#22d3ee"></i>gateway</span>
      <span><i style="background:#8fb4ff"></i>AP</span>
      <span><i style="background:#a78bfa"></i>switch</span>
      <span><i style="background:#34d399"></i>5 GHz</span>
      <span><i style="background:#fbbf24"></i>2.4 GHz</span>
      <span><i style="background:#60a5fa"></i>wired</span>
      <span><i style="background:#f87171"></i>offline</span>
    </span>
  </div>
  <div class="mapwrap"><canvas id="c"></canvas><div id="tip"></div></div>
  <div id="detail">Drag to turn, wheel to zoom, hover a node for its name, click for the numbers.</div>
</section>

<div class="grid2">
  <section class="card"><h2>Clients <span class="muted" id="clientCount"></span></h2>
    <div style="max-height:360px;overflow:auto"><table id="clients"></table></div>
  </section>
  <section class="card"><h2>Devices</h2><table id="devices"></table></section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bps = n => {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB/s';
  if (n >= 1024) return Math.round(n / 1024) + ' KB/s';
  return Math.round(n) + ' B/s';
};
const ago = ts => {
  if (!ts) return '';
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  return s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h';
};

const COL = { gateway:'#22d3ee', ap:'#8fb4ff', switch:'#a78bfa', wifi5:'#34d399', wifi2:'#fbbf24', wired:'#60a5fa', offline:'#f87171', good:'#34d399' };
let ST = null, nodes = [], edges = [];
let W = 0, H = 0, dpr = 1, rotX = -0.42, rotY = 0.65, zoom = 1, drag = null, hover = null, picked = null, t = 0;
const c = $('c'), ctx = c.getContext('2d');

function hash(s) { let h = 0; s = String(s || ''); for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0; return h; }

async function api(url, opts) {
  try {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}));
    const j = await r.json().catch(() => null);
    return j || { ok: false, error: 'HTTP ' + r.status };
  } catch (e) { return { ok: false, error: String(e) }; }
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = c.clientWidth; H = c.clientHeight;
  c.width = Math.floor(W * dpr); c.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function project(p) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  let x = p.x * cy - p.z * sy;
  let z = p.x * sy + p.z * cy;
  let y = p.y * cx - z * sx;
  z = p.y * sx + z * cx;
  const d = 900;
  const k = d / Math.max(200, d + z) * zoom;
  return { x: W / 2 + x * k, y: H / 2 + y * k, z: z, k: k };
}

function build() {
  nodes = []; edges = [];
  const devs = (ST && ST.devices) || [];
  const gwDev = devs.find(d => d.type === 'udm' || d.type === 'ugw' || d.type === 'usg') || null;
  const gw = { id: gwDev ? gwDev.mac : 'gw', kind: 'gateway', label: gwDev ? gwDev.name : 'Gateway',
    state: 1, x: 0, y: 0, z: 0 };
  nodes.push(gw);
  const others = devs.filter(d => !gwDev || d.mac !== gwDev.mac);
  const ring = Math.max(210, Math.min(300, (W || 900) * 0.3));
  others.forEach((d, i) => {
    const ang = (i / Math.max(1, others.length)) * Math.PI * 2 + 0.4;
    const y = (i % 2 ? -1 : 1) * (45 + (i % 3) * 22);
    const node = { id: d.mac, kind: d.type === 'usw' ? 'switch' : 'ap', label: d.name, state: d.state,
      x: Math.cos(ang) * ring, y: y, z: Math.sin(ang) * ring };
    nodes.push(node);
    const parentId = d.uplink && nodes.some(n => n.id === d.uplink) ? d.uplink : gw.id;
    edges.push({ s: node.id, t: parentId, kind: 'uplink', rate: 0 });
  });
  const byAnchor = {};
  for (const cl of ((ST && ST.clients) || [])) {
    const anchor = (cl.apMac && nodes.some(n => n.id === cl.apMac)) ? cl.apMac
      : (cl.swMac && nodes.some(n => n.id === cl.swMac)) ? cl.swMac : gw.id;
    (byAnchor[anchor] = byAnchor[anchor] || []).push(cl);
  }
  for (const [anchorId, list] of Object.entries(byAnchor)) {
    const a = nodes.find(n => n.id === anchorId) || gw;
    list.forEach(cl => {
      const h = hash(cl.mac);
      const ang = (h % 628) / 100;
      const tilt = ((h >>> 8) % 628) / 100 - Math.PI / 2;
      const rad = 60 + (h % 55);
      const node = {
        id: cl.mac, kind: 'client', label: cl.name, client: cl,
        band: cl.wired ? 'wired' : (cl.radio === 'ng' ? 'wifi2' : 'wifi5'),
        x: a.x + Math.cos(ang) * Math.cos(tilt) * rad,
        y: a.y + Math.sin(tilt) * rad * 0.7,
        z: a.z + Math.sin(ang) * Math.cos(tilt) * rad
      };
      nodes.push(node);
      edges.push({ s: node.id, t: a.id, kind: 'client', rate: (Number(cl.rxBps) || 0) + (Number(cl.txBps) || 0) });
    });
  }
}

function drawNode(n, p) {
  const r = n.kind === 'gateway' ? 15 : n.kind === 'client' ? 3.5 : 8;
  const col = n.kind === 'client' ? (n.client && n.client.wired ? COL.wired : COL[n.band] || COL.wifi5)
    : (n.kind === 'gateway' ? COL.gateway : n.kind === 'switch' ? COL.switch : COL.ap);
  const offline = n.kind !== 'client' && n.state !== 1;
  if (offline) {
    ctx.strokeStyle = COL.offline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = col;
  ctx.globalAlpha = offline ? 0.55 : 0.95;
  if (n.kind === 'gateway') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i + Math.PI / 6;
      const x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.6, r * p.k), 0, Math.PI * 2); ctx.fill();
    if (n.kind !== 'client') {
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3, r * p.k) + 4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  if ((n.kind === 'gateway' || n.kind === 'ap' || n.kind === 'switch') && p.z > -250) {
    ctx.font = '600 11px ui-sans-serif,system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(226,232,255,.9)';
    ctx.fillText(n.label, p.x, p.y + Math.max(18, r * p.k + 14));
  }
  if (hover === n) {
    ctx.strokeStyle = '#eef0ff'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(8, r * p.k) + 7, 0, Math.PI * 2); ctx.stroke();
  }
}

function paint() {
  ctx.clearRect(0, 0, W, H);
  const pos = {};
  for (const n of nodes) pos[n.id] = project(n);
  const sorted = edges.slice().sort((a, b) => (pos[a.s].z + pos[a.t].z) - (pos[b.s].z + pos[b.t].z));
  for (const e of sorted) {
    const a = pos[e.s], b = pos[e.t];
    if (!a || !b) continue;
    const depth = (a.z + b.z) / 2;
    ctx.strokeStyle = 'rgba(120,140,220,' + Math.max(0.05, Math.min(0.4, 0.34 - depth / 1200)) + ')';
    ctx.lineWidth = e.kind === 'uplink' ? 1.2 : 0.7;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // Traffic particles: a busy link has more, and faster, dots.
    const rate = Number(e.rate) || 0;
    const count = Math.min(6, 1 + Math.floor(Math.log10(rate + 10)));
    const speed = 0.10 + Math.min(0.55, Math.log10(rate + 10) / 14);
    const na = nodes.find(n => n.id === e.s), nb = nodes.find(n => n.id === e.t);
    if (!na || !nb) continue;
    for (let i = 0; i < count; i++) {
      const ph = ((t * speed) + i / count + (hash(e.s) % 100) / 100) % 1;
      const q = project({ x: na.x + (nb.x - na.x) * ph, y: na.y + (nb.y - na.y) * ph, z: na.z + (nb.z - na.z) * ph });
      ctx.fillStyle = e.kind === 'uplink' ? '#8fb4ff' : (na.client && na.client.wired ? COL.wired : COL[na.band] || COL.wifi5);
      ctx.globalAlpha = 0.35 + 0.5 * Math.sin(ph * Math.PI);
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(0.9, 1.7 * q.k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const order = nodes.slice().sort((p, q) => pos[p.id].z - pos[q.id].z);
  for (const n of order) drawNode(n, pos[n.id]);
  t += 0.016;
  requestAnimationFrame(paint);
}

function pick(x, y) {
  let best = null, bestD = 1e9;
  for (const n of nodes) {
    const p = project(n);
    const r = Math.max(10, (n.kind === 'gateway' ? 18 : n.kind === 'client' ? 8 : 14) * p.k);
    const d = (x - p.x) ** 2 + (y - p.y) ** 2;
    if (d < r * r && d < bestD) { bestD = d; best = n; }
  }
  return best;
}

c.addEventListener('pointerdown', ev => {
  drag = { x: ev.clientX, y: ev.clientY, moved: 0 };
  c.classList.add('dragging'); c.setPointerCapture(ev.pointerId);
});
c.addEventListener('pointermove', ev => {
  const r = c.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = ev.clientX; drag.y = ev.clientY;
    rotY += dx * 0.007; rotX += dy * 0.007;
    rotX = Math.max(-1.35, Math.min(1.35, rotX));
    return;
  }
  hover = pick(x, y);
  const tip = $('tip');
  if (hover) {
    const n = hover;
    let line = '<b>' + esc(n.label) + '</b>';
    if (n.kind === 'client') {
      const cl = n.client || {};
      line += '<br>' + esc(cl.ip || '') + (cl.wired ? ' · wired' : cl.essid ? ' · ' + esc(cl.essid) : '') +
        (cl.signal && !cl.wired ? ' · ' + cl.signal + ' dBm' : '') +
        '<br>' + bps(cl.rxBps) + ' down / ' + bps(cl.txBps) + ' up';
    } else if (n.kind !== 'gateway') {
      const d = ((ST && ST.devices) || []).find(x => x.mac === n.id);
      line += '<br>' + esc(d ? d.model : '') + (n.state === 1 ? ' · online' : ' · OFFLINE') +
        (d ? ' · ' + d.clients + ' clients' : '');
    }
    tip.innerHTML = line;
    tip.style.display = 'block';
    tip.style.left = Math.min(W - 250, x + 14) + 'px';
    tip.style.top = Math.max(4, y - 10) + 'px';
    c.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    c.style.cursor = 'grab';
  }
});
c.addEventListener('pointerup', ev => {
  const moved = drag && drag.moved > 6;
  c.classList.remove('dragging'); drag = null;
  if (moved) return;
  const r = c.getBoundingClientRect();
  picked = pick(ev.clientX - r.left, ev.clientY - r.top);
  const box = $('detail');
  if (!picked) {
    box.textContent = 'Drag to turn, wheel to zoom, hover a node for its name, click for the numbers.';
    return;
  }
  if (picked.kind === 'client') {
    const cl = picked.client || {};
    box.innerHTML = '<b>' + esc(cl.name) + '</b> · ' + esc(cl.ip) + ' · ' + (cl.wired ? 'wired' : esc(cl.essid || 'wifi')) +
      (cl.apName ? ' via <b>' + esc(cl.apName) + '</b>' : '') +
      '<br>' + (cl.wired ? '' : 'signal <b>' + cl.signal + ' dBm</b> · ') +
      'satisfaction <b>' + (cl.satisfaction >= 0 ? cl.satisfaction + '%' : '—') + '</b> · ' +
      bps(cl.rxBps) + ' down / ' + bps(cl.txBps) + ' up · seen ' + esc(ago(cl.lastSeen)) + ' ago';
  } else {
    const d = ((ST && ST.devices) || []).find(x => x.mac === picked.id);
    box.innerHTML = '<b>' + esc(picked.label) + '</b>' + (d ? ' · ' + esc(d.model) + ' · ' + (d.state === 1 ? 'online' : '<span style="color:#fecaca">offline</span>') + ' · ' + d.clients + ' clients' : '');
  }
});
c.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoom = Math.max(0.35, Math.min(3.2, zoom * (ev.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

function renderHeader() {
  const w = ST.wan || {};
  $('wanChip').className = 'chip ' + (w.up ? 'good' : 'bad');
  $('wanChip').innerHTML = w.up ? '<b>WAN up</b>' : '<b>WAN down</b>';
  $('ipChip').innerHTML = w.ip ? '<b>' + esc(w.ip) + '</b>' : '';
  $('latChip').innerHTML = w.latency ? 'latency <b>' + Math.round(w.latency) + ' ms</b>' : '';
  $('wanDown').textContent = bps(w.downBps) + ' down';
  $('wanUp').textContent = bps(w.upBps) + ' up';
  const more = [];
  if (w.speed) more.push(Math.round(w.speed) + ' Mbps link');
  if (w.xputDown) more.push('speedtest ' + Math.round(w.xputDown) + ' / ' + Math.round(w.xputUp) + ' Mbps');
  if (w.rxErrors || w.txErrors) more.push('errors ' + (w.rxErrors || 0) + '/' + (w.txErrors || 0));
  $('wanMore').textContent = more.join(' · ');
  $('note').textContent = 'sampled ' + ago(ST.at) + ' ago';
}

function renderCards() {
  const k = ST.counts || {};
  $('counts').innerHTML =
    '<span class="pill good">' + (k.clients || 0) + ' clients</span>' +
    '<span class="pill">' + (k.wifi || 0) + ' wifi</span>' +
    '<span class="pill">' + (k.wired || 0) + ' wired</span>' +
    '<span class="pill">' + (k.devices || 0) + ' devices</span>' +
    (k.offline ? '<span class="pill bad">' + k.offline + ' offline</span>' : '');
  $('countsMore').textContent = 'sampled ' + ago(ST.at) + ' ago · site ' + (ST.site || '');
  const issues = ST.issues || [];
  $('issues').innerHTML = issues.length ? issues.map(x => '<li>' + esc(x) + '</li>').join('') : '<li class="empty">nothing wrong</li>';
  const now = Date.now() / 1000;
  const fresh = (ST.clients || []).filter(cl => cl.firstSeen && now - cl.firstSeen < 86400)
    .sort((a, b) => b.firstSeen - a.firstSeen);
  $('newdevs').innerHTML = fresh.length
    ? fresh.slice(0, 8).map(cl => '<div class="sub">' + esc(cl.name) + ' · ' + esc(cl.ip) + ' · ' + ago(cl.firstSeen) + ' ago</div>').join('')
    : '<div class="empty">nothing new</div>';
}

function renderTables() {
  const clients = (ST.clients || []).slice().sort((a, b) => (b.rxBps + b.txBps) - (a.rxBps + a.txBps));
  $('clientCount').textContent = '· ' + clients.length;
  $('clients').innerHTML =
    '<thead><tr><th>client</th><th>ip</th><th>via</th><th>signal</th><th class="right">down</th><th class="right">up</th></tr></thead><tbody>' +
    clients.map(cl => {
      const col = cl.wired ? COL.wired : (cl.radio === 'ng' ? COL.wifi2 : COL.wifi5);
      const pct = cl.wired || !cl.signal ? 0 : Math.max(0, Math.min(100, (cl.signal + 90) / 50 * 100));
      return '<tr><td><span class="dot" style="background:' + col + '"></span>' + esc(cl.name) + '</td>' +
        '<td class="muted">' + esc(cl.ip) + '</td>' +
        '<td class="muted">' + esc(cl.wired ? (cl.apName || 'wired') : (cl.apName || cl.essid || '')) + '</td>' +
        '<td>' + (cl.wired ? '<span class="muted">—</span>' : '<span class="sig"><i style="width:' + pct + '%"></i></span>' + cl.signal + '</td>') +
        '<td class="num">' + bps(cl.rxBps) + '</td><td class="num">' + bps(cl.txBps) + '</td></tr>';
    }).join('') + '</tbody>';
  const devs = ST.devices || [];
  $('devices').innerHTML =
    '<thead><tr><th>device</th><th>model</th><th>state</th><th class="right">clients</th></tr></thead><tbody>' +
    devs.map(d => '<tr><td>' + esc(d.name) + '</td><td class="muted">' + esc(d.model) + '</td>' +
      '<td>' + (d.state === 1 ? '<span class="dot" style="background:' + COL.good + '"></span>online' : '<span class="dot" style="background:' + COL.offline + '"></span>offline') + '</td>' +
      '<td class="num">' + (d.clients || 0) + '</td></tr>').join('') + '</tbody>';
}

async function load() {
  const r = await api('/api/modules/integrations/network/state');
  if (!r || !r.ok || !r.state) {
    $('note').textContent = 'network data: ' + ((r && r.state && r.state.error) || (r && r.error) || 'no answer');
    return;
  }
  ST = r.state;
  if (!ST.ok) { $('note').textContent = 'network data: ' + (ST.error || 'unavailable'); return; }
  renderHeader(); renderCards(); build(); renderTables();
}

$('refresh').onclick = async () => {
  const b = $('refresh'); b.disabled = true; b.textContent = 'checking…';
  const r = await api('/api/modules/integrations/network/check', { method: 'POST' });
  if (r && r.state) { ST = r.state; if (ST.ok) { renderHeader(); renderCards(); build(); renderTables(); } }
  b.disabled = false; b.textContent = 'refresh';
};

resize(); load(); paint();
setInterval(load, 15000);
</script>
</body>
</html>
